let GBASE=null,GIMG=null;
function gradeBase(W,H){if(!GIMG){GIMG=new Image();GIMG.onload=()=>{GBASE=null;drawGrades(document)};GIMG.src='img/light_practical_light.jpg';return null}if(!GIMG.complete||!GIMG.naturalWidth)return null;
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),iw=GIMG.naturalWidth,ih=GIMG.naturalHeight,s=Math.max(W/iw,H/ih),sw=W/s,sh=H/s;g.drawImage(GIMG,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,W,H);return g.getImageData(0,0,W,H).data}
function gradeOp(op,r,g,b,x,y,W,H){const L=r*.3+g*.59+b*.11,mixS=(s)=>[L+(r-L)*s,L+(g-L)*s,L+(b-L)*s];
 switch(op){
 case'log':{const f=v=>.18+.55*Math.pow(v,.6);const m=mixS(.55);return m.map(f)}
 case'lut':return[r,g,b];
 case'warm':return[r*1.12,g*1.02,b*.82];case'cool':return[r*.85,g*.98,b*1.15];case'tint':return[r*1.06,g*.9,b*1.06];
 case'lift':return[r+.12*(1-r),g+.12*(1-g),b+.12*(1-b)];case'gamma':return[Math.pow(r,.75),Math.pow(g,.75),Math.pow(b,.75)];case'gain':return[r*1.3,g*1.3,b*1.3];
 case'offset':return[r+.06,g+.02,b-.03];
 case'contrast':return[r,g,b].map(v=>(v-.4)*1.45+.4);case'sat':return mixS(1.7);case'desat':return mixS(.35);
 case'crush':return[r,g,b].map(v=>Math.max(0,(v-.1)/.9));case'matte':return[r,g,b].map(v=>.1+.85*v);
 case'rolloff':return[r,g,b].map(v=>v<.6?v:.6+(1-Math.exp(-(v-.6)*2.5))*.38);
 case'tealorange':{const t=Math.min(1,L*1.6);return[r*(.8+.35*t),g*(.95+.05*t),b*(1.2-.45*t)]}
 case'bleach':{const m=mixS(.45);return m.map(v=>(v-.45)*1.5+.45)}
 case'film':{const s=v=>v<.5?2*v*v*.9+v*.1:1-2*(1-v)*(1-v)*.9-(1-v)*.1;return[s(r)*1.04,s(g)*1.0,s(b)*.92+.03*(1-L)]}
 case'grain':{const n=(Math.sin(x*12.9898+y*78.233)*43758.5453%1)*.12-.06;return[r+n,g+n,b+n]}
 case'vignette':{const dx=x/W-.5,dy=(y/H-.5)*.8,v=1-Math.min(.7,(dx*dx+dy*dy)*2.2);return[r*v,g*v,b*v]}
 case'mono':return[L,L,L];
 case'split':{const t=Math.min(1,L*1.8);return[r*(.85+.3*t),g*(.95+.05*t),b*(1.25-.45*t)]}
 case'dfn':{const m=mixS(.25);return[m[0]*.45,m[1]*.55,m[2]*.85]}
 case'skin':{const sk=r>g&&g>b&&(r-b)>.08&&(r-b)<.5;return sk?[r*1.05,g,b*.95]:[L,L,L]}
 case'window':{const dx=(x/W-.5)/.22,dy=(y/H-.45)/.38,ins=Math.max(0,1-Math.sqrt(dx*dx+dy*dy));const k=1+.45*Math.min(1,ins*3),d=.75+.25*Math.min(1,ins*3);return[r*k*d,g*k*d,b*k*d]}
 case'halation':return[r,g,b];default:return[r,g,b]}}
function gradeDraw(c){const op=c.dataset.grade,W=c.width,H=c.height,g=c.getContext&&c.getContext('2d');if(!g)return;
 if(!GBASE||GBASE.W!==W){const a=gradeBase(W,H);if(!a){g.fillStyle='#222';g.fillRect(0,0,W,H);return}GBASE={W,a}}
 const im=g.createImageData(W,H),s=GBASE.a,d=im.data,lin=v=>v/255;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=(y*W+x)*4;let r=lin(s[k]),gg=lin(s[k+1]),b=lin(s[k+2]);
  let o=x<W/2?(op==='lut'?gradeOp('log',r,gg,b,x,y,W,H):[r,gg,b]):gradeOp(op,r,gg,b,x,y,W,H);
  if(op==='halation'&&x>=W/2){let acc=0;for(let k2=-6;k2<=6;k2+=2){const xx=Math.min(W-1,Math.max(0,x+k2)),kk=(y*W+xx)*4;acc+=Math.max(0,(s[kk]+s[kk+1]+s[kk+2])/765-.75)}o=[o[0]+acc*.5,o[1]+acc*.12,o[2]+acc*.05]}
  d[k]=Math.max(0,Math.min(255,o[0]*255));d[k+1]=Math.max(0,Math.min(255,o[1]*255));d[k+2]=Math.max(0,Math.min(255,o[2]*255));d[k+3]=255;if(Math.abs(x-W/2)<1){d[k]=255;d[k+1]=180;d[k+2]=70}}
 g.putImageData(im,0,0);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(4,4,46,13);g.fillRect(W/2+4,4,40,13);g.fillStyle='#fff';g.font='10px sans-serif';g.fillText(op==='lut'?'LOG':'BEFORE',8,14);g.fillText(op==='lut'?'+ LUT':'AFTER',W/2+8,14)}
function drawGrades(root){const cs=[...(root||document).querySelectorAll('canvas[data-grade]')];let i=0;const nx=()=>{const c=cs[i++];if(!c)return;gradeDraw(c);setTimeout(nx,5)};setTimeout(nx,40)}

["Tracking / follow","Camera travels with a moving subject.","Keeps the audience with the character.","Goodfellas' Copacabana shot, chase scenes.","m:track","tracking shot following the subject"],
["Handheld","Camera on the operator's shoulder or hands.","Urgency, realism, documentary feel, chaos.","Saving Private Ryan, The Bourne films, Euphoria.","m:handheld","handheld camera, subtle shake"],
["Steadicam","Stabilised vest + arm + sled: smooth floating moves on foot.","Long smooth walks through spaces, stairs.","The Shining's hallways, Goodfellas' Copa.","m:steadicam","smooth steadicam shot floating through the space"],
["Gimbal","Motorised stabiliser (Ronin, RS): lighter and cheaper than Steadicam.","Smooth moves on small productions, social content.","Most commercials and social films today.","m:gimbal","smooth gimbal shot"],
["Drone / aerial","Camera flying.","Establishing, scale, reveal over a location.","Hotel/resort films, car ads, landscapes.","m:drone","aerial drone shot rising over the location"],
["Zoom","The lens changes focal length; the camera doesn't move.","70s style, documentary, attention shift.","Barry Lyndon's slow zoom-outs, Tarantino zooms.","m:zoom","slow zoom in"],
["Crash zoom / snap zoom","A very fast zoom in.","Shock, comedy, punchy energy.","Edgar Wright, Kill Bill, kung fu films.","m:crash","crash zoom"],
["Dolly zoom (Vertigo effect)","Dolly out while zooming in (or the reverse): subject stays the same size, background stretches.","Realisation, vertigo, panic.","Vertigo, Jaws' beach shot, Goodfellas' diner.","m:dollyzoom","dolly zoom vertigo effect"],
["Whip pan","An extremely fast pan that blurs.","Energy, transitions between scenes.","La La Land, Edgar Wright transitions.","m:whip","whip pan motion blur"],
["Roll / barrel roll","The camera rotates around the lens axis.","Disorientation, dreams, action.","Inception's hallway, music videos.","m:roll","camera rolls rotating the frame"],
["Rack focus / pull focus","Focus shifts from one subject to another in the same shot.","Directs attention; reveals something.","Classic in dialogue and thrillers.","m:rack","rack focus from foreground to background"],
["Oner / long take","One continuous shot through a whole scene or more.","Immersion, real time, virtuosity.","1917, Birdman, Children of Men's car scene.","m:oner","one continuous long take"]]},
{id:'comp',e:'',t:'Composition',d:'How to place things in the frame, with diagrams.',items:()=>[
["Rule of thirds","Place the subject on the lines / intersections dividing the frame in thirds.","Balanced, natural framing; eyes on the top third.","Most interviews and dialogue.","c:thirds",""],
["Centre framing / symmetry","Subject in the dead centre, frame symmetrical.","Formal, powerful, confrontational, stylised.","Wes Anderson, Kubrick's one-point perspective.","c:center","symmetrical centered composition"],
["Leading lines","Lines in the set lead the eye to the subject.","Guides attention, adds depth.","Roads, corridors, railings; Kubrick's corridors.","c:leading","leading lines toward the subject"],
["Frame within a frame","A door, window or arch frames the subject inside the frame.","Focus, isolation, voyeurism.","The Searchers' final doorway shot.","c:fwf","framed through a doorway"],
["Headroom","Space between the top of the head and the frame edge.","Too much looks amateur; tight headroom is modern and intense.","Close-ups often crop the top of the head.","c:headroom",""],
["Lead room / look room","Space in front of where the subject looks or moves.","Feels natural and open.","Standard for interviews and walking shots.","c:leadroom",""],
["Short-siding","The subject looks toward the near edge with empty space behind.","Unease, being trapped, something wrong.","Mr. Robot is famous for it.","c:shortside",""],
["Negative space","A lot of empty space around a small subject.","Loneliness, scale, minimalism.","Mr. Robot, Moonlight, fashion films.","c:negspace","minimal composition with lots of negative space"],
["Foreground layers / depth","Elements in foreground, middle and background.","Depth, richness, 'expensive' frames.","Deakins frames, product ads with blurred foreground.","c:layers","layered composition with blurred foreground"],
["Dirty frame","Part of a foreground person or object in frame, out of focus.","Realism, voyeurism, OTS depth.","Dirty OTS in most dialogue.","c:dirty",""],
["Triangle composition","Three subjects or shapes form a triangle.","Stable, balanced group shots.","Classic painting and group frames.","c:triangle",""],
["Low horizon","The horizon low in the frame; the sky dominates.","Freedom, scale, epic.","Westerns, Days of Heaven.","c:lowhorizon",""],
["High horizon","The horizon high; the ground dominates.","Weight, being trapped, intimacy with the land.","Fargo, desert films.","c:highhorizon",""],
["Deep staging","Action in foreground and background at the same time.","Lets the audience choose; long takes without cuts.","Citizen Kane, Spielberg's blocking.","c:deep",""],
["Golden ratio / spiral","A spiral (≈1.618) guiding the eye to the subject.","Elegant, painterly balance.","Renaissance paintings, many stills.","c:golden",""],
["180-degree rule","Keep the camera on one side of the line between two actors.","Keeps screen direction consistent; breaking it disorients.","Every dialogue scene; The Shining breaks it on purpose.","c:rule180",""],
["Eyeline match","Characters' eyelines match across cuts.","Makes the audience believe they are looking at each other.","Shot / reverse-shot dialogue.","c:eyeline",""]]},

{id:'edit',e:'',t:'Editing & transitions',d:'Every cut by name, shown on a timeline.',items:()=>[
["Hard cut","Instant change from one shot to the next.","The default: invisible when it follows action or a look.","Every film.","e:cut"],["J-cut","Audio of the next shot starts before its picture.","Smooth, natural dialogue; pulls you into the next scene.","Dialogue scenes, documentaries.","e:jcut"],
["L-cut","Audio of the previous shot continues over the next picture.","Reactions, smooth flow.","Dialogue, interviews over B-roll.","e:lcut"],["Jump cut","Same shot with time removed: the image jumps.","Energy, time passing, vlogs.","Breathless, YouTube vlogs.","e:jump"],
["Match cut","Shape, movement or sound matches across two shots.","Elegant link between ideas or times.","2001's bone to spaceship, Lawrence of Arabia's match.","e:match"],["Smash cut","Abrupt cut from calm to loud (or the reverse).","Shock or comedy.","Comedy punchlines, horror.","e:smash"],
["Cross dissolve","One shot fades into the next.","Time passing, memory, softness.","Montages, memories.","e:dissolve"],["Fade to / from black","Picture fades to black (or from it).","End or start of a chapter.","Act breaks.","e:fade"],
["Cross-cutting / parallel editing","Alternating between two places happening at the same time.","Tension, comparison.","The Godfather's baptism sequence.","e:cross"],["Cutaway","Cut to something else, then back.","Context, hide a cut, comedy.","Family Guy, interviews with B-roll.","e:cutaway"],
["Montage","Many short shots compressing time, usually over music.","Training, travel, change over time.","Rocky's training montage.","e:montage"],["Shot / reverse shot","Alternating between two people talking.","The basic grammar of dialogue.","Every conversation.","e:srs"],
["Whip-pan transition","A fast pan hides the cut into the next scene.","Energy, fast scene changes.","Edgar Wright, La La Land.","e:whip"],["Wipe","A line or shape wipes one shot away.","Playful, retro.","Star Wars.","e:wipe"],
["Hidden / invisible cut","The cut hides in a dark frame or an object passing the lens.","Fake one-take shots.","Birdman, 1917, Rope.","e:hidden"],["30-degree rule","Move the camera at least 30° between two shots of the same subject.","Avoids accidental jump cuts.","Coverage planning.","e:r30"]]},

function vVis(v,big){const t=(v||'').split(':')[0],k=(v||'').slice(t.length+1);if(t==='p')return vPhoto(k,big);if(t==='n')return vNoPhoto();const w=big?400:240,h=big?225:135;
 if(t==='s'&&PRESETS[k])return`<canvas data-fig="${k}" width="${w}" height="${h}" style="width:100%;border-radius:8px;background:#222"></canvas>`;
 if(t==='g')return`<canvas data-grade="${k}" width="${big?480:240}" height="${big?270:135}" style="width:100%;border-radius:8px;background:#222"></canvas>`;
 if(t==='m')return mv(k);if(t==='c')return cp(k);if(t==='e')return ed(k);if(t==='G')return gIcon(k);return''}
const VCACHE={};
function vDraw(el){realizeFigs(el);const cs=[...el.querySelectorAll('canvas[data-fig]')];let i=0;const nx=()=>{const c=cs[i++];if(!c)return;const k=c.dataset.fig+'@'+c.width,g=c.getContext&&c.getContext('2d');if(g&&PRESETS[c.dataset.fig]){if(!VCACHE[k]){const sc=normScene(Object.assign({exp:0,amb:.1,yaw:0,bg:.55},clone(PRESETS[c.dataset.fig])));const a=new Uint8ClampedArray(c.width*c.height*4);try{SIM.render(sc,c.width,c.height,a)}catch(e){}VCACHE[k]=a}const im=g.createImageData(c.width,c.height);im.data.set(VCACHE[k]);g.putImageData(im,0,0)}setTimeout(nx,8)};setTimeout(nx,20);drawGrades(el)}
function openVocab(){cur=null;app.innerHTML=`<button class="back" onclick="home()">← Back</button><h2>Film Vocabulary: name it, see it</h2><p class="mut" style="margin-top:0">Every term a DP, director or editor uses, by name, with a picture. Like that reel, but for everything. Tap a list, then flip through it.</p><div class="mods">${VOCAB.map(v=>`<div class="mod" onclick="openVList('${v.id}')"><h3>${v.e} ${v.t}</h3><div class="mut" style="font-size:13px">${v.d}</div><div class="prog">${v.items().length} terms</div></div>`).join('')}</div>`;scrollTo(0,0)}
function openVList(id){const v=VOCAB.find(x=>x.id===id),it=v.items();cur=null;app.innerHTML=`<button class="back" onclick="openVocab()">← Vocabulary</button><h2>${v.e} ${v.t}</h2><p class="mut" style="margin-top:0">${v.d}</p><div style="display:flex;gap:8px;margin-bottom:12px"><button class="cta" onclick="vflip('${id}',0)">Flip through all ${it.length}</button></div>
 <div class="mods">${it.map((x,i)=>`<div class="mod" onclick="openVItem('${id}',${i})"><div class="n">${i+1}</div><h3>${x[0]}</h3>${vVis(x[4])}<div class="mut" style="font-size:13px;margin-top:6px">${x[1]}</div></div>`).join('')}</div>`;vDraw(app);scrollTo(0,0)}
function openVItem(id,i){const v=VOCAB.find(x=>x.id===id),it=v.items(),x=it[i],[t,k]=(x[4]||'').split(':');cur={l:{id:'v-'+id+'-'+i,t:x[0],learn:[x[1]]}};
 app.innerHTML=`<button class="back" onclick="openVList('${id}')">← ${v.t}</button><div class="n mut" style="font-size:12px">${v.e} ${v.t.toUpperCase()} · ${i+1}/${it.length}</div><h2>${x[0]}</h2><div class="card hook"><p class="lead">${x[1]}</p></div>
 <div class="card"><div style="max-width:640px">${vVis(x[4],1)}</div>${t==='s'?`<button class="copy" style="margin-top:8px" onclick="openSim('${k}')">Open in the simulator</button>`:''}${x[6]?`<button class="copy" style="margin-top:8px" onclick="openSim('${x[6]}')">Try it in the simulator</button>`:''}
 <h3>How / when to use it</h3><p>${x[2]}</p><h3>Where you've seen it</h3><p>${x[3]}</p>${x[5]?`<h3>AI prompt</h3><div class="box" style="font-family:ui-monospace,monospace;font-size:13px">${x[5]}</div><button class="copy" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(x[5]).replace(/"/g,'&quot;')});toast('Prompt copied')">Copy prompt</button> `:''}<button class="copy ai-btn" onclick="ask('vv-${id}-${i}',${JSON.stringify(x[0]+' ('+v.t+'): deeper explanation, how pros use it, common mistakes, 3 more real examples').replace(/"/g,'&quot;')},this)">Go deeper</button><div class="ai" id="deep-vv-${id}-${i}" hidden></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${i?`<button onclick="openVItem('${id}',${i-1})">← ${it[i-1][0]}</button>`:''}<button onclick="vflip('${id}',${i})">Flip</button>${i<it.length-1?`<button class="cta" onclick="openVItem('${id}',${i+1})">${it[i+1][0]} →</button>`:''}</div>`;vDraw(app);scrollTo(0,0)}

function vfGo(i){const it=VOCAB.find(x=>x.id===VF.id).items();VF.i=(i+it.length)%it.length;const x=it[VF.i],box=document.getElementById('vfV');if(!box)return;
 const[t,k]=(x[4]||'').split(':');{box.innerHTML=vVis(x[4],1);vDraw(box)}

function vfPlay(){const b=document.getElementById('vfB');if(VF.play){clearInterval(VF.play);VF.play=null;b.textContent='Play';return}b.textContent='Pause';VF.play=setInterval(()=>{if(!document.getElementById('vfV')){clearInterval(VF.play);VF.play=null;return}vfGo(VF.i+1)},+document.getElementById('vfS').value)}

// ---------- BTS BREAKDOWN: upload any BTS photo, get every piece of gear named ----------
function openBTS(){cur=null;CHMODE=null;app.innerHTML=`<button class="back" onclick="home()">← Back</button><h2>BTS Breakdown</h2><p class="mut" style="margin-top:0">Screenshot any BTS photo (Instagram carousels, set photos, your own shoots) and drop it here. Up to 4 images at once: add the final frame too if you have it. Claude numbers every light, modifier, flag, frame and camera item it can see, explains what each one does, how the whole setup works, and how you'd rebuild it.</p>
 <div class="card"><label class="drop" id="drop">Drop BTS screenshots here or click to choose<input type="file" id="fi" accept="image/*" multiple hidden></label><div class="thumbs" id="thumbs"></div>
 <textarea id="note" rows="2" placeholder="Optional: who shot it, what it's for, what you want to learn (e.g. 'how is the key built?')"></textarea>
 <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="cta ai-btn" id="go" data-topic="BTS breakdown">Break it down</button><button onclick="FILES=[];openBTS()">Clear</button></div><div class="ai" id="review" hidden></div></div>
 <div class="card"><h3>What you'll get</h3><ol><li><b>Gear spotted:</b> a numbered list, with where each item is in the photo and what it does</li><li><b>How the setup works:</b> key, fill, back and negative fill, plus the light quality, direction and colour</li><li><b>The look it creates</b>, and why</li><li><b>Rebuild it:</b> a pro version and a budget version with your kind of kit</li><li><b>3 quick questions</b> to lock it in</li></ol></div>`;
 FILES=[];initCheck();document.getElementById('go').onclick=btsRun;scrollTo(0,0)}
async function btsRun(){const box=document.getElementById('review'),btn=document.getElementById('go'),note=document.getElementById('note').value.trim();box.hidden=false;
 if(!SAMPLE){box.textContent=NOAI;return}if(!FILES.length){box.textContent='Add at least one BTS image.';return}if(!IMG_OK){box.textContent='Image analysis isn\'t available in this view yet.';return}
 btn.disabled=true;box.textContent='Reading the set…';
 const prompt=`You are a top gaffer and DP teaching a working cinematographer (commercials, hotels, perfume; be punchy and scannable) by breaking down behind-the-scenes photos.
He attached ${FILES.length} image(s): BTS of a set, maybe plus a final frame. ${note?'His note: '+note:''}

Reply in exactly this structure (markdown):
**The setup in one line:** …
**Gear spotted** (numbered; for each: name it precisely, e.g. "12x12 frame of full grid cloth (orange edge)", "large spherical soft source with fabric egg-crate", "4x4 black floppy", "C-stand", "fresnel with barn doors", "ceiling bounce/silk"; say WHERE it is in the photo, e.g. "top left", "behind talent"; then what it does in this setup). Include camera, lens, support, monitors, set dressing and practicals when visible.
**How the light works:** key / fill / back or edge / negative fill / ambient, each with direction, quality (hard or soft), likely colour temperature and relative level.
**The look it creates:** 2–3 bullets (ratio estimate, mood, palette, why it works).
**Rebuild it:** Pro version (numbered fixture list with positions and modifiers) and Budget version (max 3 lights plus bounce and flags; Aputure/Nanlite-class gear).
**Quiz:** 3 short questions about this setup, answers hidden on the line after each as "Answer: …".
Only name what you can actually see; say "can't tell" when unsure, and never invent brands you can't read.`;
 try{const blobs=await Promise.all(FILES.map(shrink));const r=await SAMPLE(prompt,{images:blobs,modelTier:'complex',onText:({text})=>{box.innerHTML=fmt(text)}});box.innerHTML=fmt(r.text);addXP(10,'BTS broken down')}
 catch(e){box.textContent=e.code==='rate_limited'?'Too many requests, try again in a minute.':(e.code==='not_granted'?NOAI:'Something went wrong: '+(e.message||e.code))}
 btn.disabled=false}

{d:8,w:2,p:'look_euphoria',t:'One bold colour per scene',film:'Euphoria (2019–)',dp:'Marcell Rév',

 rec:['Choose ONE colour for the scene','Wash the face with it from the side','Add a warm rim for separation'],

{d:9,w:2,p:'look_wick',t:'Steel blue vs warm practicals, rain',film:'John Wick 2–4',dp:'Dan Laustsen',

 rec:['Steel blue key at 45°','Red/amber practical as rim from behind','Wet surfaces in the background'],

{d:10,w:2,p:'look_br2049',t:'Orange haze world',film:'Blade Runner 2049 (2017)',dp:'Roger Deakins',
 one:'Everything soaked in orange dust: soft, low-contrast, monochromatic.',
 how:['The Las Vegas look was largely achieved in camera with a custom filter pack based on Lee gel colours (pinks and oranges).','Deakins explained the red/orange Vegas was meant to contrast the cold look of LA.','Across the film he "used a bit of everything", from giant ring lights to theatrical spotlights.'],
 why:'One overwhelming colour + haze = an alien, dangerous atmosphere, and the cold LA scenes feel colder by contrast.',
 pro:['Huge soft overhead/side sources, haze/atmosphere, coloured filtration or gels','Orange-tinted production design'],
 budget:['Large bounce lit by an orange-gelled light, plus haze','Orange gel on the lens? No: gel the lights, it\'s more controllable','Overcast day + orange gels + haze outside'],
 grade:['Collapse the palette toward orange (hue vs hue)','Low contrast, lifted shadows (haze feel)','Keep a little detail in highlights'],

 src:[['Deakins on Blade Runner 2049 colour (Filmmaker Magazine)','https://filmmakermagazine.com/?p=103272'],['Lighting Blade Runner 2049 — gaffer Bill O\'Leary (ARRI)','https://arri.com/news-en/lighting-blade-runner-2049-'],['Blade Runner 2049 lighting setups incl. Vegas filter pack (ECG)','https://www.ecgprod.com/?p=8955'],['Deakins forum: the orange lighting','https://www.rogerdeakins.com/?p=215425']],

{d:11,w:3,p:'look_skyfall',t:'Silhouette against an LED wall',film:'Skyfall (2012)',dp:'Roger Deakins',

{d:12,w:3,p:'look_batman',t:'On the edge of darkness, red',film:'The Batman (2022)',dp:'Greig Fraser',

{d:13,w:3,p:'look_dune',t:'Hard sun + uplight from the ground',film:'Dune: Part Two (2024)',dp:'Greig Fraser',

{d:14,w:3,p:'look_revenant',t:'Natural light, ultra-wide, magic hour',film:'The Revenant (2015)',dp:'Emmanuel Lubezki',

{d:15,w:3,p:'look_moonlight',t:'Glowing dark skin, bold colour',film:'Moonlight (2016)',dp:'James Laxton',
 one:'Rich, shiny, colourful dark skin; dreamlike Miami colour instead of documentary realism.',
 how:['Jenkins and Laxton wanted to move away from a documentary look toward something dreamlike.','Rather than playing it safe, Laxton built the look around pulling rich colour from the actors\' skin; he wanted a shine on skin to feel the heat.','Colourist Alex Bickel used three LUTs emulating different film stocks for the three chapters (Fuji, Agfa, modified Kodak).'],
 why:'Dark skin reflects less and shows colour beautifully when you light for sheen and colour, not just exposure.',

{d:18,w:4,p:'look_perfume',t:'Perfume: glowing glass + beauty talent',film:'Luxury fragrance ads (Aurador-style)',dp:'Commercial technique',
 one:'Bottle glows from within with clean edges; talent lit with soft clamshell beauty light.',
 how:['Glass shouldn\'t be blasted from the front: the light should come from behind/sides so the edges and liquid glow.','A pro trick: cut a paper card in the shape and colour of the bottle and place it behind, so a dark background doesn\'t make the glass look grey.','Use black cards around the set to shape reflections, and small projected/snooted lights for the label and cap.'],

const WEEKS=['Shape & mood','Colour & night','Big directional light','Commercial & music video'];
function openLookLab(){cur=null;const done=LOOKS.filter(l=>S.done['chal-look-'+l.d]).length;
 app.innerHTML=`<button class="back" onclick="home()">← Back</button><h2>Look Library: iconic looks, fast</h2><p class="mut" style="margin-top:0">Pick any look. Each one gives you the 60-second recipe first, then how the DP actually did it (sourced), a live recreation in the simulator, pro vs budget gear, grade notes and an optional challenge.</p>
 <div class="card"><b>${LOOKS.length} looks</b> · ${done} recreated for real</div>
 ${WEEKS.map((wt,wi)=>`<h3 style="margin-top:18px">${wt}</h3><div class="mods">${LOOKS.filter(l=>l.w===wi+1).map(l=>`<div class="mod" onclick="openLook(${l.d})"><h3>${l.t}</h3><div class="mut">${l.film}${l.dp!=='Commercial technique'?' · '+l.dp:''}</div><canvas data-fig="${l.p}" width="240" height="135" style="width:100%;border-radius:8px;margin-top:8px;background:#222"></canvas><div class="prog">${S.done['chal-look-'+l.d]?'recreated':''}</div></div>`).join('')}</div>`).join('')}`;
 drawFigs(app);scrollTo(0,0)}
function openLook(d){const L=LOOKS.find(x=>x.d===d);cur={l:{id:'look-'+d,t:L.t,learn:L.how}};CHMODE=null;
 app.innerHTML=`<button class="back" onclick="openLookLab()">← Look Lab</button><div class="n mut" style="font-size:12px;letter-spacing:.08em">LOOK LIBRARY · ${WEEKS[L.w-1].toUpperCase()}</div><h2>${L.t}</h2><p class="mut" style="margin-top:0">${L.film} · ${L.dp}</p>
 <div class="tabs">${['Breakdown','Recreate it','Gear: pro vs budget','Grade','Challenge','Sources'].map((x,i)=>`<button data-t="${i}" class="${i?'':'on'}" onclick="ltab(${i},${d})">${x}</button>`).join('')}</div><div id="tb"></div>`;ltab(0,d);scrollTo(0,0)}
function ltab(i,d){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t===i));const L=LOOKS.find(x=>x.d===d),tb=document.getElementById('tb'),nxt=i<5?`<button class="cta" style="margin-top:10px" onclick="ltab(${i+1},${d})">Next →</button>`:'';
 const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`,ol=a=>`<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
 const v=[`<div class="card hook"><h3>The look in one line</h3><p class="lead">${L.one}</p><h3>60-second recipe</h3>${ol(L.rec)}</div>${L.p?`<div class="card">${F(L.p,'A real photo with this kind of light (not a still from the film). Want to play with it? Open the simulator.')}</div>`:''}<div class="card"><h3>How they actually did it</h3>${ul(L.how)}<h3>Why it works</h3><p>${L.why}</p><div style="margin-top:8px"><button class="copy ai-btn" onclick="ask('look-${d}',${JSON.stringify('the '+L.t+' look from '+L.film+' (DP '+L.dp+'): exact recreation plan for a small commercial crew, with fixture list, positions, levels and camera settings').replace(/"/g,'&quot;')},this)">Go deeper (full recreation plan)</button></div><div class="ai" id="deep-look-${d}" hidden></div></div>`,
  L.p?`<div class="card"><p class="mut" style="margin-top:0">Recreation loaded. Steps:</p>${ol(L.rec)}${simView()}</div>`:`<div class="card"><p>Build your own look from scratch:</p>${ol(L.rec)}${simView()}</div>`,
  `<div class="grid2"><div class="card"><h3>Pro version</h3>${ul(L.pro)}</div><div class="card"><h3>Budget version</h3>${ul(L.budget)}</div></div>`,
  `<div class="card"><h3>Grade notes (DaVinci Resolve)</h3>${ul(L.grade)}<p class="mut" style="font-size:13px">Get the look in camera first; the grade only finishes it.</p></div>`,
  `<div class="card chal"><h3>Challenge</h3><p>${L.chal}</p>${S.done['chal-look-'+d]?'<div class="box"><b>Passed</b></div>':''}<button class="cta" onclick="CHMODE={l:'look-${d}',brief:${JSON.stringify('Recreate the '+L.t+' look ('+L.film+'): '+L.chal).replace(/"/g,'&quot;')}};ltab(6,${d})">Upload for review (+50 XP if it passes)</button></div>`,
  `<div class="card"><h3>Sources (read / watch)</h3>${L.src.length?vids(L.src):'<p class="mut">This one is yours.</p>'}${L.short.length?`<h3>Short-form (TikTok)</h3>${vids(L.short)}`:''}<p class="mut" style="font-size:13px">These open in a new tab: Shtat Lab can't embed videos or images from other sites.</p></div>`,
  checkView('Look Lab day '+d+': '+L.t)];
 tb.innerHTML=v[i]+(i<6?nxt:'');if(i===0)drawFigs(tb);if(i===1)initSim(L.p||'threepoint');if(i===6)initCheck()}

buildIndex();renderStats();home();
</script>
