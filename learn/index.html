<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Shtat Lab: Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--panel:#16161a;--panel2:#1e1e24;--line:#2a2a32;--txt:#ececf1;--mut:#9a9aa8;--key:#ffb347;--fill:#6fa8ff;--back:#ff6b9d;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0 0 .4em}
a{color:var(--key)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,13,15,.92);backdrop-filter:blur(8px);z-index:5}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:20px}.logo span{color:var(--key)}
#srch{flex:1;min-width:200px;max-width:420px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit}#srch:focus{outline:none;border-color:var(--key)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-left:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--key),var(--back))}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button:hover{border-color:var(--key)}
.cta{background:var(--key);color:#111;font-weight:600;border:0}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(120deg,#1d1610,#16161a 60%);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}
.hero p{color:var(--mut);margin:.2em 0 0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.mod:hover{transform:translateY(-2px);border-color:var(--key)}
.mod .n{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.mod.locked{opacity:.55}
.mod .prog{font-size:12px;color:var(--mut);margin-top:8px}
.lessons{display:grid;gap:10px;margin-top:12px}
.les{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.les:hover{border-color:var(--key)}.les.done{border-color:var(--ok)}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{padding:8px 12px;font-size:13px}.tabs button.on{background:var(--key);color:#111;border-color:var(--key)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.hook{border-left:4px solid var(--back)}
.diagram{background:#101014;border-radius:12px;padding:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
ul{padding-left:18px;margin:.3em 0}li{margin:.25em 0}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.ex:last-child{border:0}
.ex b{display:block}.ex small{color:var(--mut)}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.film{background:#3b2a12;color:var(--key)}.tv{background:#122a3b;color:var(--fill)}.ad{background:#3b1228;color:var(--back)}.yt{background:#3b1212;color:#ff6b6b}.web{background:#1e2e1e;color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{background:#143322;border-color:var(--ok)}.opt.wrong{background:#3a1616;border-color:#f87171}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--key);color:#111;font-weight:700;padding:12px 20px;border-radius:12px;transition:.3s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
.back{margin-bottom:10px}
.mut{color:var(--mut)}
.chal{border:1px dashed var(--key)}
.copy{font-size:13px;padding:6px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:13px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gear{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.gear summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--panel2)}
.gear summary::-webkit-details-marker{display:none}
.gear .num{width:28px;height:28px;border-radius:50%;background:var(--key);color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.gear .body{padding:14px;display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:start}
.gear .pic{background:#101014;border-radius:10px;padding:8px}
.ai{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;margin-top:10px;font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--mut)}
.drop:hover{border-color:var(--key)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{height:90px;border-radius:8px}
textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-top:10px}
.lead{font-size:17px;line-height:1.6}
.card h3{margin-top:18px}.card h3:first-child{margin-top:0}
.box{border-left:4px solid var(--key);background:var(--panel2);border-radius:8px;padding:10px 14px;margin:14px 0}.box b{color:var(--key)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.fig{margin:0;background:#101014;border-radius:12px;padding:8px}.fig canvas{width:100%;border-radius:8px;display:block;background:#222}
.fig figcaption{font-size:13px;color:var(--mut);margin-top:6px}.fig figcaption .copy{margin-top:6px;display:inline-block}
.sim{margin-top:6px}.simgrid{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(1000px,100%);max-height:94vh;overflow:auto}
.inp{width:100%;margin:0 0 8px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
.winrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.winrow .rng{width:100%;margin:2px 0}
.sigs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#plan{width:100%;max-width:320px;border-radius:12px;touch-action:none;cursor:grab;background:#101014}
#view{width:100%;border-radius:12px;background:#222;image-rendering:auto}
.meter{margin-top:8px;font-size:14px;background:var(--panel2);border-radius:8px;padding:8px 10px}
.simctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rng{display:grid;grid-template-columns:1fr 120px 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}.rng output{font-size:12px;color:var(--key);text-align:right}
.chk{font-size:13px;display:inline-flex;gap:6px;align-items:center;margin:6px 10px 0 0}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
.lchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.lchip{font-size:12px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center}.lchip i{width:10px;height:10px;border-radius:50%;display:inline-block}.lchip.on{border-color:var(--key);background:#2a2216}
.vid{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.vid:last-child{border:0}.vid small{display:block;color:var(--mut)}
@media(max-width:760px){.simgrid,.simctl{grid-template-columns:1fr}}
@media(max-width:640px){.hero{grid-template-columns:1fr}.gear .body{grid-template-columns:1fr}}
.card.book{line-height:1.65}@media(max-width:700px){.flipgrid{grid-template-columns:1fr!important}}.card.book h3{margin-top:22px}

/* --- phone app tweaks --- */
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
body{-webkit-font-smoothing:antialiased}
@media(max-width:640px){
 header{padding:10px 14px;gap:8px}
 header .logo{font-size:18px}
 #srch{order:3;flex-basis:100%;max-width:none;font-size:16px}
 .stats{gap:6px}.pill{padding:5px 9px;font-size:12px}.bar{width:60px}
 .wrap{padding:14px}
 .hero{padding:16px;margin:12px 0}
 button{min-height:40px}
 input,select,textarea{font-size:16px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -14px;padding:0 14px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none}
 .modalbox{padding:12px}
}
body:not(.has-ai) .ai-btn{display:none!important}
@media (orientation:landscape) and (max-height:540px){header{position:static;padding:8px 16px;gap:8px;flex-wrap:nowrap}header #srch{flex:1;min-width:120px}.stats{flex-wrap:nowrap}.stats #rank{display:none}main,#app{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="home()" style="cursor:pointer">SHTAT<span>LAB</span> </div><input id="srch" placeholder="Search or ask anything… (Enter)" onkeydown="if(event.key==='Enter')doSearch(this.value)">
  <div class="stats">
    <span class="pill"><b id="streak">0</b> day streak</span>
    <span class="pill"><b id="xp">0</b> XP · Lvl <b id="lvl">1</b><span class="bar"><i id="xpbar" style="width:0%"></i></span></span>
    <span class="pill" id="rank">Rank: Grip Trainee</span>
  </div>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="ch-a.js"></script><script src="ch-b.js"></script><script src="ch-c.js"></script>
<script>
// ---------- STATE (localStorage, safe) ----------
const S = (()=>{let d={xp:0,done:{},last:null,streak:0};try{d=Object.assign(d,JSON.parse(localStorage.getItem('lightlab')||'{}'))}catch(e){}return d})();
function save(){try{localStorage.setItem('lightlab',JSON.stringify(S))}catch(e){}}
const RANKS=[[0,'Grip Trainee'],[100,'Best Boy'],[250,'Gaffer'],[500,'Camera Operator'],[900,'DP'],[1500,'ASC Material'],[2500,'Deakins Mode']];
function touchStreak(){const t=new Date().toDateString();if(S.last===t)return;const y=new Date(Date.now()-864e5).toDateString();S.streak=(S.last===y)?S.streak+1:1;S.last=t;save()}
function addXP(n,msg){S.xp+=n;touchStreak();save();renderStats();toast(`+${n} XP · ${msg}`)}
function renderStats(){const lvl=Math.floor(S.xp/100)+1;xp.textContent=S.xp;document.getElementById('lvl').textContent=lvl;xpbar.style.width=(S.xp%100)+'%';streak.textContent=S.streak;let r=RANKS[0][1];RANKS.forEach(([x,n])=>{if(S.xp>=x)r=n});rank.textContent='Rank: '+r}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);

// ---------- DIAGRAMS (top-down SVG) ----------
function lamp(x,y,c,label,rot=0,soft=false){return `<g transform="translate(${x},${y}) rotate(${rot})">${soft?`<rect x="-26" y="-6" width="52" height="12" rx="3" fill="${c}" opacity=".9"/>`:`<polygon points="-10,-8 10,-8 6,8 -6,8" fill="${c}"/>`}</g><text x="${x}" y="${y+(y>150?28:-16)}" fill="${c}" font-size="12" text-anchor="middle" font-family="Inter">${label}</text>`}
function beam(x1,y1,x2,y2,c){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>`}
const subj=(x=250,y=120)=>`<circle cx="${x}" cy="${y}" r="16" fill="#ddd"/><polygon points="${x-4},${y+15} ${x+4},${y+15} ${x},${y+22}" fill="#ddd"/><text x="${x+24}" y="${y-18}" fill="#9a9aa8" font-size="11" font-family="Inter">talent (nose →cam)</text>`;
const cam=(x=250,y=250)=>`<rect x="${x-16}" y="${y-10}" width="32" height="20" rx="3" fill="#888"/><polygon points="${x-8},${y-10} ${x+8},${y-10} ${x+12},${y-20} ${x-12},${y-20}" fill="#888"/><text x="${x}" y="${y+26}" fill="#9a9aa8" font-size="11" text-anchor="middle" font-family="Inter">CAMERA</text>`;
const svg=inner=>`<svg viewBox="0 0 500 290" width="100%" style="max-height:330px">${inner}</svg>`;

const D={
threePoint:svg(beam(110,200,250,120,'#ffb347')+beam(400,210,250,120,'#6fa8ff')+beam(330,40,250,120,'#ff6b9d')+subj()+cam()+lamp(110,200,'#ffb347','KEY · 45° side, slightly high',-50,true)+lamp(400,210,'#6fa8ff','FILL · opposite, 1–2 stops under',50,true)+lamp(330,40,'#ff6b9d','BACK/RIM · behind, opp. key',150)+`<line x1="250" y1="20" x2="250" y2="285" stroke="#2a2a32"/>`),
hardSoft:svg(`<text x="125" y="22" fill="#ececf1" text-anchor="middle" font-family="Space Grotesk" font-size="14">HARD</text><text x="375" y="22" fill="#ececf1" text-anchor="middle" font-family="Space Grotesk" font-size="14">SOFT</text><line x1="250" y1="10" x2="250" y2="285" stroke="#2a2a32"/>`+lamp(60,80,'#ffb347','small source / far',0)+beam(60,80,125,160,'#ffb347')+`<circle cx="125" cy="160" r="18" fill="#ddd"/><polygon points="140,170 230,230 215,250 125,178" fill="#000" stroke="#555"/><text x="185" y="270" fill="#9a9aa8" font-size="11" font-family="Inter" text-anchor="middle">crisp shadow edge</text><rect x="285" y="50" width="90" height="14" rx="3" fill="#6fa8ff"/><text x="330" y="40" fill="#6fa8ff" font-size="12" text-anchor="middle" font-family="Inter">big source / close (8x8 grid, bounce)</text>`+beam(300,64,375,160,'#6fa8ff')+beam(370,64,375,160,'#6fa8ff')+`<circle cx="375" cy="160" r="18" fill="#ddd"/><defs><linearGradient id="g"><stop offset="0" stop-color="#000" stop-opacity=".9"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs><polygon points="388,172 480,235 460,262 372,180" fill="url(#g)"/><text x="425" y="280" fill="#9a9aa8" font-size="11" font-family="Inter" text-anchor="middle">soft, wrapping falloff</text>`),
inverse:svg(lamp(50,140,'#ffb347','source',90)+[1,2,3,4].map((d,i)=>{const x=50+d*100,o=1/(d*d);return `<rect x="${x-14}" y="${140-60*Math.sqrt(o)}" width="28" height="${120*Math.sqrt(o)}" fill="#ffb347" opacity="${.15+o*.85}" rx="3"/><text x="${x}" y="230" fill="#ececf1" font-size="13" text-anchor="middle" font-family="Space Grotesk">${d}m</text><text x="${x}" y="250" fill="#9a9aa8" font-size="12" text-anchor="middle" font-family="Inter">${['100%','25% (−2 st)','11% (−3.2 st)','6% (−4 st)'][i]}</text>`}).join('')+`<text x="250" y="280" fill="#ff6b9d" font-size="12" text-anchor="middle" font-family="Inter">double the distance → 1/4 the light (−2 stops)</text>`),
ratio:svg(subj(250,130)+cam(250,255)+lamp(120,150,'#ffb347','KEY  f/5.6',-70,true)+lamp(380,150,'#6fa8ff','FILL  f/2.8 → 2 stops = 4:1',70,true)+beam(120,150,250,130,'#ffb347')+beam(380,150,250,130,'#6fa8ff')+`<text x="250" y="40" fill="#ececf1" font-size="14" text-anchor="middle" font-family="Space Grotesk">1 stop = 2:1 · 2 stops = 4:1 · 3 stops = 8:1</text><text x="250" y="62" fill="#9a9aa8" font-size="12" text-anchor="middle" font-family="Inter">commercial/beauty ≈ 2:1 · drama ≈ 4:1–8:1 · noir 16:1+</text>`),
negFill:svg(subj(250,130)+cam(250,255)+lamp(110,150,'#ffb347','KEY (soft)',-70,true)+beam(110,150,250,130,'#ffb347')+`<rect x="360" y="90" width="12" height="90" fill="#000" stroke="#ececf1"/><text x="400" y="80" fill="#ececf1" font-size="12" text-anchor="middle" font-family="Inter">4x4 floppy / black solid</text><text x="400" y="200" fill="#9a9aa8" font-size="11" text-anchor="middle" font-family="Inter">kills bounce → shape on shadow side</text>`),
};

// ---------- GEAR GLOSSARY (numbered, expandable, illustrated) ----------
const G=(s)=>`<svg viewBox="0 0 160 110" width="100%">${s}</svg>`;
const stand=(x)=>`<line x1="${x}" y1="60" x2="${x}" y2="100" stroke="#777" stroke-width="3"/><line x1="${x}" y1="100" x2="${x-18}" y2="108" stroke="#777" stroke-width="3"/><line x1="${x}" y1="100" x2="${x+18}" y2="108" stroke="#777" stroke-width="3"/>`;
const GEAR={
 cob:{n:'COB LED fixture (e.g. Aputure 300d / 600d)',d:'A single-point, high-output LED (chip-on-board). On its own it is a HARD source. It is the "engine" you put modifiers on: softbox, lantern, fresnel, or you fire it into a bounce or through a frame of grid cloth. Bowens mount on most.',img:G(stand(80)+`<rect x="55" y="25" width="50" height="38" rx="5" fill="#444" stroke="#999"/><circle cx="80" cy="44" r="12" fill="#ffb347"/><rect x="70" y="63" width="20" height="6" fill="#666"/>`),q:'Aputure 600d COB light'},
 fresnel:{n:'Fresnel lens attachment',d:'A stepped lens in front of the source that lets you spot (tight, punchy, hard) or flood (wider) the beam. Classic hard sunlight / window punch / backlight tool. Used with barn doors to cut the edges.',img:G(stand(80)+`<rect x="50" y="25" width="60" height="38" rx="5" fill="#444"/><circle cx="110" cy="44" r="18" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="110" cy="44" r="11" fill="none" stroke="#ffb347" stroke-width="2"/><circle cx="110" cy="44" r="4" fill="#ffb347"/>`),q:'Aputure fresnel F10 attachment'},
 softbox:{n:'Softbox / Light Dome',d:'A fabric box with a front diffuser (often an inner baffle too) that turns a COB into a medium soft, directional source. Add a fabric grid (egg crate) to stop spill onto the background.',img:G(stand(80)+`<polygon points="62,55 98,55 130,15 30,15" fill="#ddd" stroke="#999"/><rect x="30" y="10" width="100" height="6" fill="#fff"/>`),q:'Aputure light dome softbox with grid'},
 lantern:{n:'Lantern / China ball',d:'A round or cylinder-shaped diffuser that spills soft light everywhere (360°). Great as a soft top light over a table or for ambient fill. Has a skirt to cut spill on one side.',img:G(`<line x1="80" y1="0" x2="80" y2="25" stroke="#777" stroke-width="2"/><ellipse cx="80" cy="60" rx="38" ry="34" fill="#f3e8d0" stroke="#bbb"/><path d="M42 60 Q80 75 118 60" fill="none" stroke="#bbb"/><path d="M42 50 Q80 65 118 50" fill="none" stroke="#bbb"/>`),q:'Aputure lantern softbox film lighting'},
 frame:{n:'8x8 / 6x6 / 4x4 frame + grid cloth',d:'A metal frame (feet: 8×8 ft ≈ 2.4 m) with fabric stretched on it. Fire a light THROUGH it (diffusion) or INTO it (bounce, if the fabric is white/ultrabounce). The bigger the frame and closer to talent, the softer. Workhorse of big soft keys. Needs 2 C-stands or combo stands, sandbags, and wind care outside.',img:G(`<rect x="30" y="8" width="100" height="80" fill="#eee" stroke="#999" stroke-width="4"/><g stroke="#ccc">${[1,2,3,4].map(i=>`<line x1="${30+i*20}" y1="8" x2="${30+i*20}" y2="88"/><line x1="30" y1="${8+i*16}" x2="130" y2="${8+i*16}"/>`).join('')}</g><line x1="30" y1="88" x2="30" y2="108" stroke="#777" stroke-width="3"/><line x1="130" y1="88" x2="130" y2="108" stroke="#777" stroke-width="3"/>`),q:'8x8 butterfly frame grid cloth film set'},
 gridcloth:{n:'Grid cloth (full / half / quarter)',d:'A woven diffusion fabric with a faint grid pattern. Full grid = most diffusion, most light loss (~2 stops); half ≈ 1–1.5 stops; quarter ≈ ½–1 stop. Same idea as 216 / 250 / 251 gels, but on a frame.',img:G(`<rect x="20" y="15" width="38" height="70" fill="#fff" opacity=".95"/><rect x="62" y="15" width="38" height="70" fill="#fff" opacity=".65"/><rect x="104" y="15" width="38" height="70" fill="#fff" opacity=".35"/><text x="39" y="102" fill="#aaa" font-size="10" text-anchor="middle">FULL</text><text x="81" y="102" fill="#aaa" font-size="10" text-anchor="middle">HALF</text><text x="123" y="102" fill="#aaa" font-size="10" text-anchor="middle">QUARTER</text>`),q:'grid cloth full half quarter diffusion'},
 ultrabounce:{n:'Ultrabounce / bounce fabric',d:'A white reflective fabric (often black on the back = negative fill on the other side!). You point the light INTO it and the whole frame becomes the source: huge, soft, natural. Less efficient than diffusion, so you need more power.',img:G(`<rect x="70" y="10" width="80" height="80" fill="#fff" stroke="#999" stroke-width="3"/>`+`<rect x="10" y="45" width="26" height="20" rx="3" fill="#444"/><circle cx="36" cy="55" r="5" fill="#ffb347"/><line x1="40" y1="55" x2="70" y2="40" stroke="#ffb347" stroke-dasharray="3 3"/><line x1="40" y1="55" x2="70" y2="70" stroke="#ffb347" stroke-dasharray="3 3"/>`),q:'ultrabounce book light film set'},
 bead:{n:'Beadboard / poly board',d:'Cheap, light white foam boards used as bounce fill (or to make a book light). Beadboard is textured and slightly softer; poly is smoother and more reflective. Paint one side black for neg fill.',img:G(`<rect x="45" y="10" width="70" height="90" fill="#f5f5f5" stroke="#bbb"/><g fill="#ddd">${Array.from({length:30},(_,i)=>`<circle cx="${52+(i%6)*11}" cy="${18+Math.floor(i/6)*17}" r="2"/>`).join('')}</g>`),q:'beadboard poly bounce film lighting'},
 meter:{n:'Light meter (e.g. Sekonic)',d:'Measures incident light (light falling ON the subject) in f-stops. Point the dome at the light to compare key vs fill = your ratio, independent of camera settings.',img:G(`<rect x="55" y="25" width="50" height="80" rx="8" fill="#333" stroke="#777"/><circle cx="80" cy="20" r="14" fill="#fff"/><rect x="62" y="40" width="36" height="22" fill="#4ade80" opacity=".8"/><text x="80" y="56" font-size="11" text-anchor="middle" fill="#111">f/4</text>`),q:'Sekonic light meter incident dome'},
 falsecolor:{n:'False colour (monitor tool)',d:'A monitor mode that paints exposure levels in colours (e.g. pink/green ≈ skin, red = clipping, purple/blue = crushed). Fast way to read ratios and skin exposure on set without a meter.',img:G(`<rect x="15" y="15" width="130" height="80" rx="4" fill="#222" stroke="#666"/><circle cx="80" cy="50" r="22" fill="#4ade80"/><path d="M80 28 A22 22 0 0 1 80 72 Z" fill="#ff6b9d"/><rect x="15" y="80" width="130" height="15" fill="#6a3cff"/><rect x="120" y="15" width="25" height="20" fill="#ff3b3b"/>`),q:'false color monitor cinematography exposure'},
 panel:{n:'Small LED panel / tube',d:'Small, light, often bi-colour or RGB. Good for fill, hair light, practical boosts, or hiding in frame. Usually needs diffusion or a grid to look nice on faces.',img:G(stand(80)+`<rect x="45" y="20" width="70" height="42" rx="4" fill="#333"/><g fill="#ffe1a6">${Array.from({length:24},(_,i)=>`<circle cx="${53+(i%8)*8}" cy="${28+Math.floor(i/8)*12}" r="2.5"/>`).join('')}</g>`),q:'small LED panel film lighting'},
 barndoors:{n:'Barn doors',d:'Four hinged metal flaps on the front of a light to shape and cut the beam — e.g. keep the backlight off the lens or off the background.',img:G(`<rect x="55" y="35" width="50" height="40" fill="#444"/><polygon points="55,35 105,35 120,15 40,15" fill="#222" stroke="#888"/><polygon points="55,75 105,75 120,95 40,95" fill="#222" stroke="#888"/><circle cx="80" cy="55" r="10" fill="#ffb347"/>`),q:'barn doors film light'},
 flag:{n:'Flag (solid, 18x24 / 24x36)',d:'A small black fabric on a wire frame mounted on a C-stand arm. Cuts light off parts of the frame (lens flare, background, hot spots).',img:G(stand(50)+`<line x1="50" y1="60" x2="110" y2="40" stroke="#777" stroke-width="3"/><rect x="100" y="12" width="45" height="34" fill="#111" stroke="#666"/>`),q:'film flag C-stand 24x36 solid'},
 floppy:{n:'4x4 floppy',d:'A 4×4 ft black flag with an extra flap that "flops" down to make it 4×8. The go-to negative fill and big cutter on set.',img:G(`<rect x="40" y="10" width="70" height="45" fill="#111" stroke="#666"/><rect x="40" y="55" width="70" height="45" fill="#222" stroke="#666" stroke-dasharray="4 3"/><text x="122" y="80" fill="#9a9aa8" font-size="10">flop</text>`),q:'4x4 floppy flag negative fill'},
 solid:{n:'Black solid / duvetyne',d:'Large black fabric (on a frame or just taped up) to kill bounce, block windows, or create negative fill on a bigger scale than a floppy.',img:G(`<rect x="25" y="8" width="110" height="85" fill="#0a0a0a" stroke="#666" stroke-width="3"/>`),q:'black solid duvetyne film set'},
 scrim:{n:'Scrims & dimmers',d:'Wire mesh scrims (single = ~½ stop, double = ~1 stop) slide into the light to cut output without changing colour. On LEDs you mostly use the dimmer, but scrims let you cut just part of the beam.',img:G(`<circle cx="80" cy="55" r="40" fill="none" stroke="#999" stroke-width="3"/><g stroke="#666">${Array.from({length:9},(_,i)=>`<line x1="${44+i*9}" y1="20" x2="${44+i*9}" y2="90"/><line x1="40" y1="${22+i*8}" x2="120" y2="${22+i*8}"/>`).join('')}</g>`),q:'film light scrim single double'},
 cstand:{n:'C-stand (Century stand)',d:'The universal grip stand: three staggered legs, a grip head and an arm. Holds flags, frames, small lights. Always put the sandbag on the high leg and the weight under the arm.',img:G(`<line x1="80" y1="25" x2="80" y2="100" stroke="#999" stroke-width="4"/><line x1="80" y1="100" x2="55" y2="108" stroke="#999" stroke-width="3"/><line x1="80" y1="95" x2="110" y2="108" stroke="#999" stroke-width="3"/><line x1="80" y1="90" x2="70" y2="108" stroke="#999" stroke-width="3"/><circle cx="80" cy="25" r="6" fill="#ccc"/><line x1="80" y1="25" x2="140" y2="15" stroke="#999" stroke-width="3"/>`),q:'C-stand grip arm'},

const F=(p,cap)=>`<figure class="fig"><canvas data-fig="${p}" width="320" height="240"></canvas><figcaption>${cap} <button class="copy" onclick="openSim('${p}')">Try it</button></figcaption></figure>`;

const CH={
'hard-soft':`
<p class="lead">Before you think about colour, ratio or mood, every light makes one decision: <b>how sharp are its shadows?</b> That single property, light <i>quality</i>, changes how a face feels more than almost anything else.</p>
<h3>1. What "hard" and "soft" actually mean</h3>
<p>Look at the edge of a shadow. If it goes from light to dark in a clean line, the light is <b>hard</b>. If it fades slowly through a long, smooth gradient, the light is <b>soft</b>. That's it: quality is the <i>width of the transition</i> between light and shadow (the "penumbra").</p>
${FF(F('hard','Fig 1 — Bare COB, 1.8 m away. Crisp nose shadow, sharp edge on the cheek.'),F('soft','Fig 2 — Same position, same exposure, through a 4x4 frame. The shadow edge melts.'))}
<h3>2. Why it happens: apparent size</h3>
<p>Every point on a light source throws its own shadow. A tiny source (bare bulb, the sun, a fresnel spot) has basically one point, so you get one clean shadow. A big source (an 8x8 frame of grid cloth) is thousands of points spread across 2.4 m. Each one throws its shadow in a slightly different place, and all those shadows overlap into a soft gradient.</p>
${BOX('The rule','Softness depends on how big the source looks <i>from the subject\'s position</i>, not on its wattage or its brand.')}
<p>That's why "apparent size" matters, not physical size. The sun is huge but 150 million km away, so from your face it's a tiny dot = hard light. A 1×1 m softbox at 50 cm is enormous from the face = very soft. Push the same softbox to 4 m and it shrinks in the subject's "view", so it gets harder.</p>
<h3>3. How you make light soft on set</h3>
<p><b>Diffusion:</b> put fabric (grid cloth, 216, silk) between the light and the subject. The fabric lights up and <i>becomes</i> the new, bigger source. Its size is now the frame's size.</p>
<p><b>Bounce:</b> aim the light <i>into</i> a white surface (ultrabounce, beadboard, a white wall). The surface becomes the source. Bounce is softer and more natural than diffusion but loses more light.</p>
<p><b>Both = book light.</b> Bounce first, then diffuse. This is the softest, most "expensive-looking" source you can build (see Pro Tricks → Book light).</p>
${BOX('Cost of softness','Every layer eats light. Full grid ≈ −2 stops, bounce ≈ −1.5 to −3 stops depending on the surface and distance. Soft light needs more power.')}
<h3>4. What each one does to a face</h3>
<p><b>Hard light</b> shows texture (pores, stubble, wrinkles), draws graphic shadows and feels direct, dramatic, honest, sometimes harsh. Think desert sun in <i>Sicario</i> or noir.</p>
<p><b>Soft light</b> smooths skin, wraps around the cheek, has gentle falloff and feels intimate, flattering, calm, "commercial". Think <i>Her</i> or perfume ads.</p>
${FF(F('rembrandt','Fig 3 — Smaller, higher source: Rembrandt triangle under the eye. More drama.'),F('book','Fig 4 — Book light: huge source, wraps the whole face. Skin looks expensive.'))}
<h3>5. The pro move: mix them</h3>
<p>Great frames rarely use only one quality. A common recipe: <b>soft key on the face, hard light on the background or the body</b> (a slash of "sun" on the wall, a hard edge on the shoulder). The soft face keeps the talent beautiful and the hard accents give the image texture and a sense of real sunlight.</p>
${BOX('Remember','Hard = small/far. Soft = big/close. Diffusion and bounce make the source bigger. Mix both for depth.')}
<h3>6. Common mistakes</h3>
<ul><li>Putting a softbox far away and wondering why it looks hard. <b>Bring it closer.</b></li><li>Diffusing everything: flat, lifeless image. Keep something hard.</li><li>Soft key in a white room without negative fill: soft AND flat. (See Negative Fill.)</li></ul>`,

'inverse':`
<p class="lead">Light gets weaker the further it travels, and not in a straight line: it drops off <b>fast</b> near the source and <b>slowly</b> far away. Once you get this, you control backgrounds without touching them.</p>
<h3>1. The law</h3>
<p>Light spreads out in all directions. At twice the distance the same light covers 4× the area, so each spot gets ¼ of the light. In stops: <b>double the distance = −2 stops.</b></p>
${BOX('Numbers to memorise','1 m → 100% · 1.4 m → 50% (−1 stop) · 2 m → 25% (−2) · 2.8 m → 12.5% (−3) · 4 m → 6% (−4)')}
<h3>2. Why DPs care: falloff = depth</h3>
<p>Your subject is 1 m in front of a wall. If the light is <b>0.6 m</b> from the subject, the wall is 1.6 m from the light: almost 3× further = about −3 stops darker. If the light is <b>3 m</b> away, the wall is 4 m from the light: only 1.3× further = barely −1 stop. <b>Same face exposure, completely different background.</b></p>
${FF(F('close','Fig 1 — Light very close (0.6 m). Face bright, wall falls into darkness.'),F('far','Fig 2 — Same face exposure, light pushed to 3 m and powered up. Wall stays bright.'))}
<h3>3. How you use it</h3>
<p><b>Moody / dark background:</b> bring the light close, dim it down. The background dies for free.</p>
<p><b>Clean, even, commercial:</b> push the light back, add power. Everything in the room gets similar light, so actors can move without changing exposure.</p>
<p><b>Walking actors:</b> if someone walks towards a close light, their exposure changes massively. Pros push the source back (or use a bigger unit far away) so the actor stays exposed through the move.</p>
${BOX('Pro trick','Want the background a specific number of stops under the face? Change the light distance, not the background light. Simulator: drag the key close, then far, and watch the wall.')}
<h3>4. The catch</h3>
<p>Closer also means <b>softer</b> (bigger apparent size). So "close and dark background" usually also gives you soft, wrapping light, which is part of why that look feels so intimate.</p>
<h3>5. Common mistakes</h3>
<ul><li>Fighting a bright background with flags when moving the key closer would fix it.</li><li>Lighting a walk-and-talk with a close source: the exposure "breathes".</li><li>Forgetting that the inverse square law is about the <i>source</i>. A huge bounce behaves more gently than a point source at short distances.</li></ul>`,

'three-point':`
<p class="lead">Three-point lighting is the alphabet of lighting. You'll rarely use it "by the book" on a real job, but every setup you'll ever build is a variation of it.</p>
<h3>1. The three jobs</h3>
<p><b>Key</b>: the main light. It decides direction, mood and exposure. Usually 30–45° off the camera axis, a bit above the eyes.</p>
<p><b>Fill</b>: on the opposite side, softer and dimmer. It doesn't light the face; it <i>controls how dark the shadows are</i>. That's your contrast ratio.</p>
<p><b>Back / rim</b>: behind the subject, usually opposite the key. It draws a bright edge on hair and shoulders and separates the subject from the background.</p>
${FF(F('keyonly','Fig 1 — Key only. Shape and mood, but the shadow side and the edges disappear into the background.'),F('threepoint','Fig 2 — Key + fill + back. Shadows open up, hair and shoulder get an edge.'))}
<h3>2. Build it in order</h3>
<ol><li><b>Key first</b>, alone. Get it right before adding anything.</li><li><b>Fill</b>: bring it up slowly until the shadows are as dark as the mood needs (often 1–3 stops under the key).</li><li><b>Back</b>: add it, then flag it off the lens (barn doors / flag) so it doesn't flare.</li><li>Check the background separately.</li></ol>
<h3>3. Upgrade it: short-side vs broad</h3>
<p>Turn the face slightly. If the key hits the side of the face <b>away from camera</b> (short side), the side facing us falls into shadow, which looks sculpted and cinematic. If the key hits the side <b>towards camera</b> (broad), the face looks wider and flatter, more "TV news".</p>
${FF(F('broad','Fig 3 — Broad lighting: key on the side facing camera. Flatter, wider face.'),F('shortside','Fig 4 — Short-side: key on the far side. More shape, more mood. Most modern DPs default to this.'))}
<h3>4. How pros actually do it</h3>
<p>The "fill" is often not a light at all: it's the room bounce, a beadboard, or nothing plus negative fill. The "back" is often a practical lamp in frame, a window, or a top light. Roger Deakins often uses a big soft "cove" light instead of a textbook key. <b>Learn the three jobs, then fill them with whatever the location gives you.</b></p>
${BOX('Remember','Key = shape. Fill = contrast. Back = separation. Short-side key = instant cinematic.')}`,

'ratios':`
<p class="lead">Ratios turn "it looks moody" into numbers you can repeat on any set, in any city, on any day. That's how a whole film or campaign stays consistent.</p>
<h3>1. Key-to-fill ratio</h3>
<p>Measure the light on the bright side of the face and the dark side. The difference in stops is your ratio:</p>
${BOX('Stops → ratio','0 stops = 1:1 (flat) · 1 stop = 2:1 · 2 stops = 4:1 · 3 stops = 8:1 · 4 stops = 16:1')}
${FF(F('ratio2','Fig 1 — ~2:1. Soft, open shadows. Beauty, commercials, comedy.'),F('ratio8','Fig 2 — ~8:1. Deep shadow side. Drama, thriller, perfume night.'))}
<h3>2. Typical ratios by genre</h3>
<ul><li><b>Beauty, perfume close-ups, corporate:</b> 1.5:1 to 2:1</li><li><b>Commercial lifestyle, sitcom:</b> 2:1 to 3:1</li><li><b>Drama:</b> 4:1 to 8:1</li><li><b>Noir, horror, moody night:</b> 16:1 and beyond</li></ul>
<h3>3. Key-to-background ratio</h3>
<p>The second number that matters: how much brighter is the face than the background? A dark background (−2 to −4 stops under the face) gives depth and mood. A bright background (equal or brighter) feels airy and commercial.</p>
<h3>4. How to measure on set</h3>
<p><b>Light meter:</b> incident dome at the face, pointed at the key, then at the fill side. Read the stops.</p>
<p><b>False colour:</b> on the monitor, the key side of the face sits around skin tone (pink/green zone on most cameras), and you read how many steps down the shadow side falls. In the simulator, switch on False colour and read the ratio meter.</p>
${BOX('Pro habit','Write ratios in your notes or on the call sheet ("key f/4, fill f/2, bg f/1.4"). When you come back for pickups weeks later, you can rebuild the look in minutes.')}
<h3>5. How you change the ratio</h3>
<ul><li>Fill light dimmer/brighter (or closer/further).</li><li>Add or remove bounce on the shadow side.</li><li><b>Negative fill</b>: more contrast without touching the key.</li><li>Change the key size: bigger sources wrap and naturally lower the ratio.</li></ul>`,

'neg-fill':`
<p class="lead">You can't make a shadow darker by adding light. In real locations (white walls, ceilings, floors) light bounces everywhere and fills your shadows whether you like it or not. Negative fill is how you take it back.</p>
<h3>1. What it is</h3>
<p>A black surface (floppy, solid, duvetyne, the black side of an ultrabounce) placed on the shadow side of the subject. It doesn't "suck" light: it <b>blocks bounce</b> from reaching that side and stops reflecting light back itself.</p>
${FF(F('negoff','Fig 1 — Soft key in a bright room. The room fills the shadows: soft AND flat.'),F('negon','Fig 2 — Same key + black floppy camera-right. The shadow side comes back, the face has shape again.'))}
<h3>2. Where you'll need it most</h3>
<ul><li>White rooms, hotel rooms, offices, kitchens</li><li>Overcast exteriors (the sky is a giant fill light from everywhere)</li><li>Any time you use a big soft key: the softer the key, the more it bounces around the room</li></ul>
<h3>3. Placement</h3>
<p><b>Closer = stronger effect.</b> Just out of frame on the shadow side, same height as the face or a bit above. Angle it to "face" the subject. Combine with a short-side key for the classic modern look.</p>
${BOX('Free negative fill','The black back of an ultrabounce, a black t-shirt on a stand, a dark curtain, a black car. On run-and-gun jobs, a collapsible black reflector is the most underrated tool in the bag.')}
<h3>4. Outside</h3>
<p>On an overcast day, a big black solid (8x8 or 12x12) on one side turns flat sky light into directional, sculpted light, with no lamps at all.</p>`

const TRICK_CH={
 book:`
<p class="lead">A book light is a soft source made of two layers: a <b>bounce</b> and a <b>diffusion frame</b>, opened like a book. It's one of the most loved tools of high-end DPs and gaffers because it looks less like "a lamp" and more like light from a bright wall or a sky.</p>
<h3>1. How it works</h3>
<ol><li>A hard light (COB, HMI, SkyPanel) fires <b>into</b> a white bounce: ultrabounce, muslin or beadboard.</li><li>That bounce lights up a <b>diffusion frame</b> in front of it (full grid, 216, silk).</li><li>The talent only "sees" the diffusion, which is evenly lit from behind = an extremely soft, even, wrapping source.</li></ol>
${F('book','Fig 1 — Simulated book light at 45°. Notice how far the light wraps around the cheek.')}
<h3>2. Why not just a softbox?</h3>
<ul><li><b>Even:</b> a direct light through diffusion makes a hotspot in the middle. Bouncing first spreads it out.</li><li><b>Big:</b> you can make 8x8 or 12x12 sources with one fixture.</li><li><b>Controllable:</b> rotate the bounce, change the diff grade, add black sides.</li></ul>
${BOX('Cost','You lose a lot of light (often 3–4 stops). That\'s why book lights use 600d–1200d LEDs or HMIs.')}
<h3>3. Variations used on set</h3>
<p><b>Classic book:</b> 8x8 ultrabounce + 8x8 full grid, at 45–90° to each other.</p>
<p><b>Bead/poly book:</b> two foam boards for small rooms and interviews.</p>
<p><b>V-flat book:</b> white inside bounces, black outside is negative fill on the other side.</p>
<p><b>Skirted book:</b> black solids on the sides so it doesn't spill onto white walls.</p>
<p><b>Window book:</b> built just inside a window so it reads as daylight from that window.</p>
<h3>4. Setting it up in 5 minutes</h3>
<ol><li>Place the diffusion frame where you want the source, close to talent (1–1.5 m).</li><li>Put the bounce behind it at an angle, like an open book.</li><li>Fire the light into the bounce, not into the diffusion.</li><li>Check that the diffusion is evenly lit (no hotspot).</li><li>Add a floppy on the other side of the face.</li></ol>`
};

const TRACK_BOOK={
commercial:`### What you are really being paid for
In a commercial nobody asks "is it realistic?". The client asks three things: **does the person look great, does the product look desirable, and does every shot cut together?** Every lighting decision in advertising comes back to those three questions. Drama lighting serves the story; commercial lighting serves the *brand*, and the brand wants control, polish and repeatability.

That changes how you work:
- You have 20–60 shots in a day, so the setup must be **fast to reset** and **consistent** across angles. You light the *space*, not only the shot.
- The image is watched on a phone, often muted, often for 1–2 seconds. The subject must **separate from the background instantly**.
- The client and agency are at the monitor. Skin, product colour and logo have to look right **on set**, not "we'll fix it in the grade".

### 1. Contrast ratio: why ads live at 2:1–4:1
The ratio is how much brighter the key side of the face is than the fill side. 2:1 = one stop difference, 4:1 = two stops, 8:1 = three stops.
- **2:1 (1 stop)**: friendly, open, "lifestyle". Banks, telecom, family products, food, hotels.
- **4:1 (2 stops)**: still clean but with shape. Cars, tech, perfume talent, sportswear.
- **8:1 and more**: drama, music videos, moody fragrance. Possible in ads, but it's a creative choice the client has to sign off on.

[[FIG:com_ratio2|2:1 — open, clean, lifestyle. Notice the face still has shape because the key is from the side.]]
[[FIG:com_ratio4|4:1 — same setup, fill pulled back one stop. More premium, more shape. Move the fill and watch the meter.]]

**How to actually set it**: meter the key side (or use false colour). Skin key around 50–60 IRE for a "normal" exposure, 55–70 for bright lifestyle. Then bring the fill up until the shadow side sits 1 stop (2:1) or 2 stops (4:1) under. On a monitor: in false colour, Caucasian key skin typically lands in the pink/grey zone, the fill side one zone darker for 2:1.

> Pro habit: set the ratio with the fill *source size and distance*, not only the dimmer. A bigger fill further away fills more evenly than a small one close.

### 2. The big soft key: why everything is 8x8 and 12x12
Softness depends on the **size of the source relative to the subject**, not the fixture. A 1200d is hard; the same 1200d bounced into an 8x8 UltraBounce 2–3 m from the face becomes a huge soft source that wraps around the cheek, hides skin texture and forgives small head movement.

Typical commercial key options, from fastest to softest:
1. **Softbox / lantern** (Light Dome, Nova with dome): fast, decent, OK for 1-person interviews.
2. **Fixture through a 4x4 or 6x6 frame of grid cloth**: soft, controllable with a grid (egg crate) to stop spill.
3. **8x8 / 12x12 frame of grid cloth or silk**: the standard for talent. Gives soft, even light across a moving actor.
4. **Book light** (fixture into a bounce, then through a diffusion frame): the softest, most even key there is. See Pro Tricks.

The rule: **bigger and closer = softer**. But closer also means faster falloff (inverse square), so the background goes darker. Further away = more even light from face to background, which is often what you want for a clean ad.

### 3. Separation: why there's an edge on almost every shot
On a phone screen, a face that blends into the background is invisible. Commercial DPs almost always add one of these:
- **Back / edge light**: a strip box, tube or small fixture behind the subject, 3/4 back, hitting hair and shoulder. Usually 0.5–1 stop over the key on the edge itself.
- **Background separation**: light the background *a different brightness or colour* from the subject. Dark subject on a lighter background, or the reverse.
- **Gradient background**: light falling off across the wall so the area behind the head is darker or lighter.

[[FIG:com_highkey|High-key white: big key + big fill + two edges + bright background. The classic "clean tech / pharma / bank" look.]]

### 4. The hero light: making the product look expensive
The product always gets **its own dedicated light** that nobody else uses. Why: you need to put a highlight exactly on the logo, the cap, the edge of the glass, the condensation on the can, and adjust it without changing the talent's light.
- **Glass and bottles (perfume!)**: never light glass from the front. Light it from **behind and the sides** with strip boxes or a diffused panel. The glass is defined by its edges. A dark background + two white edges = "dark field"; a white diffuser behind + black cards at the sides = "bright field" with black edges.
- **Labels**: a small hard light with a snoot or a projection lens (Spotlight Mini, Dedolight) to put a precise pool on the label.
- **Shiny objects (phones, cars, watches)**: you light the *reflection*, not the object. Big white cards or large diffusion panels positioned so the object reflects them. Black cards define the shape.
- **Food / drinks**: backlight. Steam, liquid and texture only show when the light comes from behind.

[[FIG:com_edges|Strip lights 3/4 behind on a dark set — the same principle that makes glass glow. Try it with a bottle in mind.]]

### 5. Matching: how ads cut together
Agencies cut fast. Every shot must look like it was taken at the same moment.
- **Lock colour temperature**: everything at 5600K (or 4300K mixed) with plus/minus green checked. Mixed LED brands drift green/magenta; gaffers carry 1/8 and 1/4 minus green gels for this.
- **Light the space, not the shot**: rig the top light and windows so turning around for the reverse needs small changes, not a relight.
- **Keep the key consistent on the face**: same IRE on the key side in every angle, same ratio.
- **Shoot a grey card / chart** at the start of each setup so the colourist can match.

### 6. Typical commercial setups you should be able to build in 10 minutes
1. **Lifestyle interior (bank, telecom, hotel)**: big soft source outside the window (a 1200d through a 12x12 or simply daylight), a bounce inside for fill, practicals on, one edge. 2:1.
2. **Talent beauty (perfume, cosmetics)**: clamshell: big soft key above the lens, bounce or a second soft source below, two strip edges, dark or gradient background. 2:1 or lower.
3. **Tech / car**: darker room, 4:1, big soft overhead or side, crisp edges, product gets reflection cards.
4. **High-key white**: big key, big fill, lit white background 1–1.5 stops over the key so it goes clean white without spilling onto the subject.
5. **Product table top**: strip lights behind/sides, black flags, a hero snoot, macro lens, slider moves to make highlights travel.

### 7. Gear you'll see on almost every ad set
- Big LED: ARRI SkyPanel S60/S360, Aputure 600d/1200d, Creamsource Vortex
- Frames: 4x4, 6x6, 8x8, 12x12 with grid cloth, silk, UltraBounce
- Strip boxes and tubes (Astera Titan, Nanlite Pavotube) for edges
- Small fixtures with snoots / projection for hero hits
- Flags, floppies, solids, negative fill everywhere: control is the whole job
- Haze, sometimes, for depth in moody ads

### 8. What separates a good ad DP from a beginner
- They **pre-light** with stand-ins and photos before the client arrives.
- They plan **coverage**: where the camera turns, which lights must move.
- They **protect skin**: flags to stop hot spots, check for shine (call makeup), soft key at the right height so eye sockets don't go dark.
- They **give the client options** fast: "this is 2:1, this is 4:1".
- They get the look **in camera**, so the grade only polishes.

### For your work (Aurador, Hilton, Isola)
- **Perfume**: talent in clamshell 2:1, bottle in dark field with two strip edges and a snoot on the label. Card behind the bottle in the liquid's colour.
- **Hotel**: shoot interiors at blue hour, boost practicals, add one soft key motivated by a lamp. Daylight interiors: big source outside the window, negative fill inside.
- **Fashion / brand**: decide the ratio first, then the edges, then the background. That order saves you time on set.`,

film:`### The one rule: light must feel like it comes from the world
In narrative film the audience should never feel "a light is on this person". Every source should be **motivated**: a window, a lamp, a TV, the sun, a streetlight, a fire. The DP's job is to make the light *believable first*, then beautiful, then emotional.

### 1. Motivation: what is lighting this scene?
Before placing a single fixture, ask:
1. Where are the real sources in this room (windows, practicals)?
2. What time is it, what weather?
3. What does the scene *feel* like (safe, tense, lonely)?

Then you **cheat** the real source: you put a much bigger, more controllable light in the direction the real source would come from. A window gets an HMI or 1200d through a 12x12 outside. A table lamp gets a small soft source hidden just out of frame on the same side.

[[FIG:window|Window key: the most common motivated key in film. Big source on one side, the room falls off.]]
[[FIG:practical|Practical-motivated: the lamp in frame "explains" the light. The real key is hidden just next to it.]]

### 2. Contrast tells the story
Narrative ratios are higher than ads, usually **4:1 to 16:1**:
- Comedy and romance: lower contrast, warmer.
- Drama: 4:1–8:1, soft sources, real shadow sides.
- Thriller/noir: 8:1+, hard sources, large dark areas.
The ratio can also change over a film as the character changes. Gordon Willis kept The Godfather getting darker as Michael gets colder.

[[FIG:ratio8|8:1 — three stops. The shadow side starts to disappear. That's drama.]]

### 3. Short-side lighting: the default for faces
Light the side of the face **away** from the camera (short side). It gives depth, a natural shadow on the near cheek and a modelled face. Broad lighting (lighting the side toward the camera) flattens and widens. Most film coverage is short-side keyed; when the camera moves to the reverse, the key stays on the "far" side for the other actor too (that's why **cross-keying** works).

[[FIG:shortside|Short-side key: light comes from the side the camera can't see. Instant depth.]]
[[FIG:broad|Broad key for comparison: flatter, wider face.]]

### 4. Negative fill: the modern secret
In real rooms light bounces off the white walls and fills everything. Modern DPs (Bradford Young, Deakins, Greig Fraser) **take light away** with black solids, floppies and duvetyne on the shadow side. That's negative fill. It's how you get shape with soft light, the "expensive soft but contrasty" look.

[[FIG:negoff|Bright room, no negative fill: soft light everywhere, flat face.]]
[[FIG:negon|Same light + black on the shadow side: shape comes back.]]

### 5. Lighting the space vs lighting the shot
On a film set with long takes and moving actors, DPs light the **set** from outside (big sources through windows, top light in the ceiling, practicals on dimmers) so the actors can move freely and the camera can turn 180°. Then they add small touches for close-ups (an eye light, a bit of fill, a flag). Deakins' coves and Fincher/Messerschmidt's ceiling LiteMats are examples.

### 6. Day vs night
- **Day interior**: big source outside the windows, ND on the windows if the exterior clips, negative fill inside.
- **Night interior**: practicals are the motivation. Boost them (higher wattage, dimmer), add hidden soft sources near them, keep the rest dark.
- **Night exterior**: one big "moonlight" or streetlight source high and far (on a condor), backlight to separate, wet the ground to get reflections. Don't flood everything: pockets of light and darkness.

[[FIG:moon|Moonlight: soft-ish, cool, from behind and high, low fill.]]

### 7. Colour as a narrative tool
- Warm/cool contrast (tungsten practicals vs blue window/moon) is the most common.
- Mixed temperatures feel real (Mindhunter).
- A single colour can mean a character or a world (Blade Runner 2049's orange).
Choose colour in pre-production with the production designer: the walls, wardrobe and practicals do half the work.

### 8. Continuity
Coverage of one scene is shot over hours while the real sun moves. DPs protect continuity by: tenting windows, using artificial "sun" that doesn't move, shooting the wide when the light is best and controlling the close-ups, and noting fixture positions and levels for every setup.

### What to practise
Light the same scene three ways: **motivated by a window, motivated by a practical, and motivated by a TV screen**. Same actor, same frame. You'll learn more from that than from any tutorial.`,

tv:`### TV is film at speed
Series lighting looks more and more like cinema, but the schedule is brutal: 6–10 pages a day versus 1–3 on a feature. So TV DPs design lighting that is **fast, repeatable and works from many angles at once**.

### 1. Lighting from the top and from outside
The key strategy: **rig the light into the set before shooting**. Soft top light (SkyPanels or LiteMats in silk boxes above the set), big sources outside the windows, practicals wired to a dimmer board. On the day, the gaffer changes levels and colour from an iPad rather than moving stands. That means the camera can shoot in almost any direction.

[[FIG:tv_soft_top|Soft top + window side + back edge: the basic "standing set" of many series. Works for wides and close-ups.]]

### 2. Cross-lighting for two cameras
TV often shoots two cameras at once (A cam wide, B cam tight, or two singles). Classic solution: **cross-keying**. Each actor's key comes from behind the other actor, so each gets a short-side key and also a backlight from the other's key. One setup lights both directions.

[[FIG:shortside|Short-side key: when you cross-key, each actor gets one of these.]]

### 3. Standing sets vs locations
- **Standing sets** (offices, apartments that return every episode) are pre-rigged and saved as dimmer-board cues: "day", "night", "rain". The look stays consistent across seasons.
- **Locations** are lit like film but with fewer, bigger moves: one big source outside, practicals, neg fill.

### 4. The "look bible"
Every series has rules: contrast range, colour palette per location, how night looks. Rotating directors and second-unit DPs follow it. Examples: Mindhunter's yellow-green offices, Severance's sterile white Lumon, The Bear's warm chaotic kitchen.

### 5. Genre differences
- **Sitcom (multicam)**: high-key, low contrast, lit for 3–4 cameras from the top. Everyone visible everywhere.
- **Prestige drama**: low key, motivated, single camera feel.
- **Procedural**: punchy colour (blue labs, warm homes), quick setups.
- **Streaming thriller**: dark, but readable on a TV in a living room. Don't go so dark you lose the eyes.

### What to practise
Light a room so you can shoot a two-person dialogue **in both directions without moving a single light**. Top soft source + window + cross-keys. Time yourself.`,

music:`### Music videos: the one place where "wrong" is right
In a music video nobody needs motivation. Light can be pure emotion, pure colour, pure graphics. It's where DPs experiment and where many commercial and film DPs built their style. But "anything goes" still needs a *system*, otherwise it looks like a party.

### 1. Start from one idea
Pick **one** visual concept per video or per scene: one colour (The Weeknd's red), one shape (a single hard top light), one movement (lights chasing the beat). The best videos are simple ideas executed hard.

[[FIG:look_weeknd|One colour, two lights: red key + red rim. Iconic because it's simple.]]

### 2. Colour
- **Complementary pairs**: orange/teal, pink/cyan, red/blue. Key in one colour, rim or background in the other.
- **Monochrome**: one colour everywhere, faces included. Strong and graphic.
- **Saturated colour on skin**: protect a bit of skin tone (lower saturation on the key, saturated on the rim and background).
RGB LEDs (Aputure Nova, SkyPanel, Astera tubes, Nanlite) make this fast: you change colour from your phone.

[[FIG:colour|Colour contrast: warm key, cool rim. The default starting point for MV colour.]]

### 3. Hard light is back
MVs love **hard light**: hard top light, hard side light, sharp shadows on a wall, light through blinds or a gobo. It's graphic and reads on a phone.

### 4. Haze
Haze shows the beams, adds depth, softens colour and makes even small sources look big. Almost every MV with coloured light uses haze. Keep it even (oil-based or water-based hazer, fans to spread).

### 5. Movement and timing
Lights can move with the music: chases on DMX, flicker, strobes on the beat, lights sweeping the camera to create flares. Programme it on a DMX board or an app (Sidus Link, Astera app). Even a friend manually sweeping a light works.

### 6. Performance vs narrative
- **Performance**: light the artist like a concert. Backlights, side lights, haze, a front key soft enough for close-ups.
- **Narrative**: light like a short film, but push colour and contrast further.

### 7. Budget reality
Many great MVs use 2–4 RGB lights, a hazer and one location. What makes them work: one strong idea, darkness around the light, and committing to the colour.

[[FIG:look_euphoria|One colour wash + warm rim (Euphoria style).]]

### What to practise
Shoot the same 10-second performance with **three different single-colour concepts**. Notice how the song feels different each time.`,

doc:`### Documentary and interviews: look good, stay invisible
In documentary you rarely control the world. In interviews you control everything, but you have 15 minutes and the subject is nervous. The lighting must be **quick, flattering and not intimidating**.

### 1. The modern interview setup
The industry-standard look today:
1. **Big soft key on the far side** (short side), roughly 45–60° off the lens, slightly above eye level. Softbox, book light or a 4x4 frame.
2. **Negative fill** on the near side (black flag) to keep shape.
3. A **hair/kicker light** from behind on the key side or opposite side for separation.
4. A **practical in the background** (lamp, window) for depth and colour.
5. The background 1–2 stops darker than the face.

[[FIG:doc_interview|Doc interview: soft far-side key, kicker, practical in the background, neg fill on the near side.]]

### 2. Where the subject looks
The subject looks slightly off-camera at the interviewer, who sits next to the lens on the **key side**. So the subject faces into the key and the short-side lighting happens naturally. (For direct-to-camera, use an Interrotron or simply move the key closer to the lens.)

### 3. Lighting for skin and eyes
- Make sure there's a **catchlight** in the eyes: the key must be visible from the eye's point of view.
- Keep the key above the eyeline but not too high, or the eye sockets go dark.
- Glasses: raise the key, or move it further to the side to lose the reflection.
- Dark skin: expose for the face, add a bit more key or a bounce, use a slightly warmer key for richness.

### 4. Observational documentary
You can't light the room. You can: choose where people stand (near windows), turn on practicals, swap bulbs for brighter/warmer ones, put a small LED panel on a stand bounced off the ceiling. And you can **expose and position yourself** to use backlight.

### 5. Fast kit
A typical one-person doc kit: 1 bright COB (Aputure 300d/600d) with a softbox or dome, 1 small LED for hair/kicker, 1 tube for background colour, a black flag, a reflector. That gives you every interview look.

### What to practise
Set up an interview in **under 15 minutes** with 3 lights. Shoot it, then try moving only the key (closer, further, higher) and see what changes.`,

beauty:`### Fashion and beauty: light that sells skin and fabric
Beauty is about **flawless skin and eyes**. Fashion is about **shape, fabric and attitude**. They use very different light.

### 1. Beauty: clamshell and butterfly
The classic beauty setup is the **clamshell**: a soft key directly above the lens (beauty dish, octa or softbox) and a fill below (reflector or a second soft source). It fills the eye sockets and under the chin, smooths skin and creates a big round catchlight. It's symmetrical: perfect for makeup, skincare and perfume talent.

[[FIG:butterfly|Butterfly / clamshell: key above the lens, fill from below. Every beauty campaign starts here.]]
[[FIG:look_perfume|Perfume talent: clamshell + cool edge. The same setup with an edge for separation.]]

**Beauty dish vs softbox**: a beauty dish (silver or white, with or without a sock) gives a slightly crisper, more contrasty light that shows skin texture but stays flattering. A big octa is softer and more forgiving.

### 2. Fashion: hard light is chic
Fashion photographers and DPs often use **hard light**: bare strobes, small dishes, direct sun. Sharp shadows show the shape of clothes and faces, and the look feels editorial and confident. Pair it with a white or coloured background lit separately.

[[FIG:fashion_hard|Hard fashion light: one small source near the lens, sharp shadow, bright background.]]

### 3. Backgrounds
- White seamless: lit 1–1.5 stops over the key so it goes pure white.
- Grey: lit to a gradient (brighter behind the head).
- Colour: gelled lights or coloured paper; keep the light off the subject so skin stays clean.

### 4. Movement on video
For fashion films, the model moves. Use bigger sources (8x8, 12x12) so the light stays even as she moves; or go fully hard and embrace the shadows.

### 5. Skin and makeup
Talk to makeup: soft light hides texture, hard light shows everything. Matte skin for hard light, a bit of dewiness for glowing skin under soft light.

### What to practise
Shoot one portrait three ways: **clamshell beauty, hard fashion light, and a soft window**. Same model, same makeup.`,

product:`### Product and perfume: you light the reflections
Products don't act, so every frame can be perfect. That's also why expectations are higher: the client will zoom in on the logo.

### 1. The golden rule
**For shiny or glass objects you don't light the object, you light what it reflects.** Look at the product from the camera position and ask "what do I see reflected in it?". Then place white cards, diffusion panels or strip lights where you want highlights, and black cards where you want dark lines.

### 2. Glass and perfume bottles
Two classic methods:
- **Dark field**: black background, light from behind and the sides (two strip boxes). The edges of the glass glow white against black. Moody, luxurious.
- **Bright field**: a white diffuser behind the bottle, lit from behind; black cards just outside the frame on the sides. The edges become black lines on a white background. Clean, fresh.

Then add: a small light under or behind to make the liquid glow, a snoot or projection spot on the label, and a card cut to the bottle's shape in the liquid's colour behind it (so a dark background doesn't make the liquid look grey).

[[FIG:com_edges|Dark-field principle: two strip lights behind the subject, almost no front light.]]

### 3. Metal, phones, watches
Use **large gradient reflections**: a diffusion panel lit unevenly so the reflection goes from bright to dark across the surface. That's the "premium" look on every Apple ad.

### 4. Food and drink
**Backlight** for steam, texture and liquid; a big soft side light; small white cards for fill; black cards to add contrast. Condensation (glycerin and water) and fake ice for drinks.

### 5. Motion
Product films come alive when highlights **move**: a slider or motion-control move that slides reflections across glass, a light dragged across the scene, a rotating turntable. Plan the move with the lighting, not after.

### 6. Macro
At macro distances light falls off fast and depth of field is tiny. You need more light than you think, small sources, and often focus stacking (photo) or a very stable rig (video).

### For Aurador
Hero bottle: dark field with two strips, snoot on the logo, liquid-coloured card behind, slider move along the bottle. Then a lifestyle version: the bottle near a window with a soft bright field.`,

hotel:`### Hotels and interiors: sell the space and the feeling
Hospitality films sell two things: **how the space looks and how it feels to be there**. Rooms must look spacious, bright and warm; the view must be visible; people (if any) look relaxed.

### 1. Balance inside and outside
The classic problem: the window is 4–6 stops brighter than the room. Solutions:
- **Shoot at the right time**: blue hour (the sky balances with interior lights) or overcast days.
- **Add light inside**: big soft sources bounced off the ceiling or walls, hidden behind furniture.
- **ND the windows**: ND gel on the glass for bigger productions.
- **HDR / bracketing** for photography, or a dual-exposure composite for video plates.

[[FIG:look_hotel|Blue hour: warm practicals inside, blue window outside. The money shot of every hotel film.]]
[[FIG:room_golden|Golden hour through a window: warm, low, long shadows. Great for bedroom and lounge moments.]]

### 2. Practicals are your friends
Every lamp in a hotel room is a light you can use. Swap bulbs for brighter 2700K bulbs, put them on dimmers, make sure the shade isn't clipping. Practicals make the room feel lived-in and warm.

### 3. Light the depth
Interiors look flat when everything is the same brightness. Create **layers**: a brighter foreground element, a lit middle (bed, sofa), a glowing background (window, lamp, corridor). Hide small LEDs (tubes, mini panels) behind furniture to lift dark corners without creating flat light.

### 4. Colour consistency
Mixed sources (daylight windows, tungsten lamps, LED strips in the ceiling) are common. Decide the balance (e.g. 4300K so windows go slightly blue and lamps warm) and fix any green LED strips with minus-green or by turning them off.

### 5. People in the space
For lifestyle shots (guest at the window, couple at dinner): use the window as the key and add a soft bounce as fill. Keep it 2:1 or 3:1 so it stays welcoming.

### 6. Wide lenses and verticals
Interiors are shot wide (16–24mm). Keep verticals straight (level camera, shift lenses or fix in post), shoot from about chest height, and light the corners because wide lenses show everything.

### For Hilton
Plan the schedule around light: lobby and restaurant at blue hour with practicals, rooms in the morning with soft window light, pool/exterior at golden hour. Bring tubes and small panels to hide, and dimmers for every practical.`

 case'whip':return SV(SUBJ(118,25,'#7a9')+SUBJ(118,85,'#79a')+`<g transform="translate(40,55)"><g>${AN('rotate','-30;-30;30;30;-30','2.4','keyTimes="0;.4;.48;.9;1"')}${CAMI()}</g></g>`,'top view · very fast pan that blurs');
 case'roll':return SV(`<g transform="translate(80,52)"><g>${AN('rotate','-15;15;-15','3')}<rect x="-55" y="-30" width="110" height="62" fill="none" stroke="#ffb347"/><circle cx="0" cy="-5" r="10" fill="#c99a7a"/><rect x="-14" y="6" width="28" height="22" rx="6" fill="#556"/></g></g>`,'camera view · frame rotates around the lens axis');
 case'rack':return SV(`<defs><filter id="bA"><feGaussianBlur stdDeviation="0"><animate attributeName="stdDeviation" values="0;0;3;3;0" keyTimes="0;.4;.5;.9;1" dur="4s" repeatCount="indefinite"/></feGaussianBlur></filter><filter id="bB"><feGaussianBlur stdDeviation="3"><animate attributeName="stdDeviation" values="3;3;0;0;3" keyTimes="0;.4;.5;.9;1" dur="4s" repeatCount="indefinite"/></feGaussianBlur></filter></defs><g filter="url(#bA)"><circle cx="45" cy="45" r="16" fill="#c99a7a"/><rect x="27" y="62" width="36" height="40" rx="10" fill="#556"/></g><g filter="url(#bB)"><circle cx="115" cy="40" r="9" fill="#b8907a"/><rect x="104" y="50" width="22" height="26" rx="6" fill="#665"/></g>`,'camera view · focus shifts from foreground to background');
 case'oner':return SV(`<path d="M10,90 L50,90 L50,40 L110,40 L110,15 L150,15" fill="none" stroke="#555" stroke-dasharray="3 3"/><g><animateMotion path="M10,90 L50,90 L50,40 L110,40 L110,15 L150,15" dur="7s" repeatCount="indefinite" rotate="auto"/>${CAMI('25,-9 25,9')}</g>`,'top view · one continuous take through several spaces');

// ---- composition diagrams (16:9 frame) ----
const CF=(s,l)=>`<svg viewBox="0 0 160 110" width="100%" style="background:#15161a;border-radius:8px"><rect x="8" y="8" width="144" height="81" fill="#22252b" stroke="#666"/>${s}${l?`<text x="8" y="102" fill="#888" font-size="7">${l}</text>`:''}</svg>`;
const PERS=(x,y,s,c)=>{s=s||1;return`<circle cx="${x}" cy="${y}" r="${7*s}" fill="${c||'#c99a7a'}"/><rect x="${x-11*s}" y="${y+8*s}" width="${22*s}" height="${30*s}" rx="${6*s}" fill="#556"/>`};
const TH=`<g stroke="#ffb347" stroke-width=".5" stroke-dasharray="2 2" opacity=".7"><line x1="56" y1="8" x2="56" y2="89"/><line x1="104" y1="8" x2="104" y2="89"/><line x1="8" y1="35" x2="152" y2="35"/><line x1="8" y1="62" x2="152" y2="62"/></g>`;
function cp(t){switch(t){
 case'thirds':return CF(`<clipPath id="cf1"><rect x="8" y="8" width="144" height="81"/></clipPath><g clip-path="url(#cf1)">${PERS(56,30,1.6)}</g>`+TH,'subject on a third line, eyes near the top third');
 case'center':return CF(`<rect x="20" y="8" width="16" height="81" fill="#333"/><rect x="124" y="8" width="16" height="81" fill="#333"/><clipPath id="cf2"><rect x="8" y="8" width="144" height="81"/></clipPath><g clip-path="url(#cf2)">${PERS(80,34,1.5)}</g><line x1="80" y1="8" x2="80" y2="89" stroke="#ffb347" stroke-width=".5" stroke-dasharray="2 2"/>`,'subject dead centre, symmetrical frame');
 case'leading':return CF(`<g stroke="#888" stroke-width="1.2"><line x1="8" y1="89" x2="100" y2="40"/><line x1="152" y1="89" x2="100" y2="40"/><line x1="8" y1="70" x2="100" y2="40"/><line x1="152" y1="60" x2="100" y2="40"/></g>${PERS(100,30,.6)}`,'lines in the set lead the eye to the subject');
 case'fwf':return CF(`<rect x="8" y="8" width="144" height="81" fill="#111"/><rect x="58" y="14" width="44" height="75" fill="#3a3f48"/>${PERS(80,40,.9)}`,'a door / window frames the subject inside the frame');
 case'headroom':return CF(`<clipPath id="cf3"><rect x="8" y="8" width="144" height="81"/></clipPath><g clip-path="url(#cf3)"><circle cx="80" cy="46" r="22" fill="#c99a7a"/><rect x="50" y="68" width="60" height="40" rx="12" fill="#556"/></g><line x1="120" y1="8" x2="120" y2="24" stroke="#ffb347"/><text x="124" y="19" fill="#ffb347" font-size="7">headroom</text>`,'space between the top of the head and the frame');
 case'leadroom':return CF(`<circle cx="45" cy="40" r="14" fill="#c99a7a"/><circle cx="58" cy="40" r="4" fill="#c99a7a"/><rect x="28" y="56" width="34" height="40" rx="8" fill="#556"/><line x1="66" y1="40" x2="146" y2="40" stroke="#ffb347" stroke-dasharray="3 3"/><text x="90" y="34" fill="#ffb347" font-size="7">look room</text>`,'space in front of where the subject looks or moves');
 case'shortside':return CF(`<circle cx="112" cy="40" r="14" fill="#c99a7a"/><circle cx="125" cy="40" r="4" fill="#c99a7a"/><rect x="95" y="56" width="34" height="40" rx="8" fill="#556"/><line x1="130" y1="40" x2="150" y2="40" stroke="#e55" stroke-dasharray="3 3"/>`,'"short-siding": looking toward the near edge = tension, unease');
 case'negspace':return CF(`<rect x="8" y="70" width="144" height="19" fill="#2e3238"/>${PERS(128,60,.35)}`,'a small subject in a big empty frame: loneliness, scale');
 case'layers':return CF(`<rect x="8" y="60" width="144" height="29" fill="#2b2f36"/><g opacity=".9">${PERS(110,40,.45,'#a88')}</g>${PERS(60,32,1)}<g filter="url(#bl)"><rect x="8" y="8" width="26" height="81" fill="#3b3b2e"/></g><defs><filter id="bl"><feGaussianBlur stdDeviation="2.5"/></filter></defs>`,'foreground, middle ground, background = depth');
 case'dirty':return CF(`<defs><filter id="bl2"><feGaussianBlur stdDeviation="3"/></filter></defs><clipPath id="cf4"><rect x="8" y="8" width="144" height="81"/></clipPath><g clip-path="url(#cf4)">${PERS(98,28,1.3)}<g filter="url(#bl2)"><ellipse cx="22" cy="80" rx="34" ry="40" fill="#3c3f47"/></g></g>`,'part of a foreground person/object in frame (out of focus)');
 case'triangle':return CF(`${PERS(80,24,.8)}${PERS(48,48,.8)}${PERS(112,48,.8)}<polygon points="80,18 44,70 116,70" fill="none" stroke="#ffb347" stroke-width=".6" stroke-dasharray="2 2"/>`,'three subjects or shapes form a stable triangle');
 case'lowhorizon':return CF(`<rect x="8" y="70" width="144" height="19" fill="#3a3326"/><rect x="8" y="8" width="144" height="62" fill="#2b3b52"/>${PERS(52,56,.4)}`,'horizon low: the sky dominates = freedom, scale');
 case'highhorizon':return CF(`<rect x="8" y="22" width="144" height="67" fill="#3a3326"/><rect x="8" y="8" width="144" height="14" fill="#2b3b52"/>${PERS(52,50,.6)}`,'horizon high: the ground dominates = weight, being trapped');
 case'deep':return CF(`<rect x="8" y="60" width="144" height="29" fill="#2b2f36"/>${PERS(40,30,1.2)}${PERS(110,38,.5,'#a88')}${PERS(128,44,.35,'#998')}`,'deep staging: action in foreground and background at once');
 case'golden':return CF(`<path d="M152,89 C152,40 120,8 70,8 C35,8 8,30 8,55 C8,75 25,89 45,89 C60,89 70,78 70,66 C70,58 64,52 57,52" fill="none" stroke="#ffb347" stroke-width=".7"/>${PERS(58,44,.6)}`,'golden spiral: the eye spirals into the subject');
 case'rule180':return SV(`<line x1="10" y1="55" x2="150" y2="55" stroke="#e55" stroke-dasharray="4 3"/>${SUBJ(55,40)}${SUBJ(105,40,'#a88')}<g transform="translate(80,95) rotate(-90)">${CAMI('45,-25 45,25')}</g><text x="112" y="70" fill="#e55" font-size="7">don't cross</text>`,'top view · keep the camera on one side of the line between two actors');
 case'eyeline':return CF(`<line x1="80" y1="8" x2="80" y2="89" stroke="#666"/><circle cx="50" cy="40" r="11" fill="#c99a7a"/><circle cx="60" cy="40" r="3.5" fill="#c99a7a"/><circle cx="110" cy="40" r="11" fill="#b8907a"/><circle cx="100" cy="40" r="3.5" fill="#b8907a"/><line x1="64" y1="40" x2="96" y2="40" stroke="#ffb347" stroke-dasharray="2 2"/>`,'eyelines match: they look at each other across the cut');
 default:return CF('')}}
// ---- editing timelines ----
const TL=(v,a,l)=>`<svg viewBox="0 0 160 110" width="100%" style="background:#15161a;border-radius:8px"><text x="4" y="30" fill="#888" font-size="7">V1</text><text x="4" y="62" fill="#888" font-size="7">A1</text>${v}${a||''}${l?`<text x="6" y="100" fill="#888" font-size="7">${l}</text>`:''}</svg>`;
const CL=(x,w,c,y,t)=>`<rect x="${x}" y="${y||18}" width="${w}" height="18" rx="2" fill="${c}"/>${t?`<text x="${x+3}" y="${(y||18)+12}" fill="#111" font-size="7">${t}</text>`:''}`;
const AU=(x,w,c)=>`<rect x="${x}" y="50" width="${w}" height="16" rx="2" fill="${c}" opacity=".7"/>`;
const A_='#7fb3ff',B_='#ffb36b',C_='#a5e08f';
function ed(t){switch(t){
 case'cut':return TL(CL(18,60,A_,0,'A')+CL(78,64,B_,0,'B'),AU(18,60,A_)+AU(78,64,B_),'A ends, B starts: instant change');
 case'jcut':return TL(CL(18,70,A_,0,'A')+CL(88,54,B_,0,'B'),AU(18,45,A_)+AU(63,79,B_),'J-cut: you HEAR B before you SEE B');
 case'lcut':return TL(CL(18,50,A_,0,'A')+CL(68,74,B_,0,'B'),AU(18,80,A_)+AU(98,44,B_),'L-cut: A\'s sound continues over B\'s picture');
 case'jump':return TL(CL(18,40,A_,0,'A')+CL(62,40,A_,0,'A')+CL(106,36,A_,0,'A'),'','same shot, time removed: a visible jump');
 case'match':return TL(`<circle cx="50" cy="27" r="8" fill="#ddd"/><rect x="18" y="18" width="62" height="18" fill="none" stroke="${A_}"/><circle cx="111" cy="27" r="8" fill="#ffb347"/><rect x="80" y="18" width="62" height="18" fill="none" stroke="${B_}"/>`,'','shape/movement in A matches B (bone → spaceship)');
 case'smash':return TL(CL(18,70,'#556',0,'quiet')+CL(88,54,'#e55',0,'LOUD'),AU(18,70,'#445')+`<path d="M88,58 L92,50 L96,66 L100,50 L104,66 L108,50 L112,66 L116,50 L120,66 L124,50 L128,66 L132,50 L136,66 L142,58" fill="none" stroke="#e55"/>`,'abrupt cut from calm to chaos (or the reverse)');
 case'dissolve':return TL(`<defs><linearGradient id="dg"><stop offset="0" stop-color="${A_}"/><stop offset="1" stop-color="${B_}"/></linearGradient></defs>`+CL(18,60,A_,0,'A')+`<rect x="64" y="18" width="30" height="18" fill="url(#dg)"/>`+CL(94,48,B_,0,'B'),'','A fades into B: time passing, memory');
 case'fade':return TL(`<defs><linearGradient id="fg"><stop offset="0" stop-color="${A_}"/><stop offset="1" stop-color="#000"/></linearGradient></defs>`+CL(18,70,A_,0,'A')+`<rect x="70" y="18" width="30" height="18" fill="url(#fg)"/><rect x="100" y="18" width="42" height="18" fill="#000" stroke="#333"/>`,'','fade to black: end of a chapter');
 case'cross':return TL(CL(18,22,A_,0,'A')+CL(40,22,B_,0,'B')+CL(62,22,A_,0,'A')+CL(84,22,B_,0,'B')+CL(106,18,A_,0,'A')+CL(124,18,B_,0,'B'),'','cross-cutting: two places at the same time, alternating');
 case'cutaway':return TL(CL(18,58,A_,0,'A')+CL(76,22,C_,0,'C')+CL(98,44,A_,0,'A'),AU(18,124,A_),'cutaway to something else, sound of A continues');
 case'montage':return TL([0,1,2,3,4,5,6,7,8].map(i=>CL(18+i*14,13,[A_,B_,C_,'#d9a3ff'][i%4])).join(''),AU(18,124,'#d9a3ff'),'many short shots over music = time compressed');
 case'srs':return TL(`<rect x="18" y="12" width="60" height="30" fill="#22252b" stroke="${A_}"/><circle cx="56" cy="25" r="7" fill="#c99a7a"/><circle cx="50" cy="25" r="2.2" fill="#c99a7a"/><rect x="80" y="12" width="60" height="30" fill="#22252b" stroke="${B_}"/><circle cx="102" cy="25" r="7" fill="#b8907a"/><circle cx="108" cy="25" r="2.2" fill="#b8907a"/>`,'','shot / reverse shot: the basic dialogue cut');
 case'whip':return TL(CL(18,58,A_,0,'A')+`<rect x="76" y="18" width="16" height="18" fill="#888" opacity=".6"/><g stroke="#ccc" stroke-width=".7"><line x1="76" y1="22" x2="92" y2="22"/><line x1="76" y1="27" x2="92" y2="27"/><line x1="76" y1="32" x2="92" y2="32"/></g>`+CL(92,50,B_,0,'B'),'','whip-pan blur hides the cut');
 case'wipe':return TL(CL(18,58,A_,0,'A')+`<polygon points="76,18 96,18 86,36 76,36" fill="${A_}"/><polygon points="96,18 86,36 96,36" fill="${B_}"/>`+CL(96,46,B_,0,'B'),'','a line/shape wipes A away (Star Wars)');
 case'hidden':return TL(CL(18,58,A_,0,'A')+`<rect x="74" y="18" width="10" height="18" fill="#000"/>`+CL(84,58,B_,0,'B'),'','hidden cut: through a dark frame or object passing the lens');
 case'r30':return SV(SUBJ(80,30)+`<g transform="translate(40,90) rotate(-55)">${CAMI('40,-10 40,10')}</g><g transform="translate(120,90) rotate(-125)">${CAMI('40,-10 40,10')}</g><path d="M50,80 A50,50 0 0 1 110,80" fill="none" stroke="#ffb347" stroke-dasharray="2 2"/><text x="70" y="70" fill="#ffb347" font-size="7">≥30°</text>`,'top view · move the camera at least 30° between cuts');
 default:return TL('')}}
